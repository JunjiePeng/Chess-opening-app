/* chess.com-style captured-piece trays: opponent's captures above the board,
   yours below, with a "+N" badge on whoever is ahead in material. */
const INIT_COUNTS={P:8,N:2,B:2,R:2,Q:1,K:1,p:8,n:2,b:2,r:2,q:1,k:1};
function updateEval(){
  const top=document.getElementById('capTop'), bot=document.getElementById('capBottom');
  if(!top||!bot) return;
  const c={};
  for(let r=0;r<8;r++) for(let f=0;f<8;f++){ const p=board[r][f]; if(p) c[p]=(c[p]||0)+1; }
  const order=['q','r','b','n','p'], val={p:1,n:3,b:3,r:5,q:9};
  const byWhite=[], byBlack=[]; let netW=0;
  for(const t of order){
    const up=t.toUpperCase();
    const missBlack=INIT_COUNTS[t]-(c[t]||0);   // black pieces gone = captured by White
    const missWhite=INIT_COUNTS[up]-(c[up]||0); // white pieces gone = captured by Black
    for(let i=0;i<missBlack;i++) byWhite.push(t);
    for(let i=0;i<missWhite;i++) byBlack.push(up);
    netW += val[t]*((c[up]||0)-(c[t]||0));
  }
  const tray = arr => arr.map(p=>`<span class="cap">${pieceSVG(p)}</span>`).join('');
  const youWhite = playerSide==='w';
  const yourCaps = youWhite?byWhite:byBlack, engCaps = youWhite?byBlack:byWhite;
  const yourNet  = youWhite?netW:-netW;
  top.innerHTML = tray(engCaps) + (yourNet<0?`<span class="adv">+${-yourNet}</span>`:'');
  bot.innerHTML = tray(yourCaps) + (yourNet>0?`<span class="adv">+${yourNet}</span>`:'');
}
function showCapTrays(on){
  const d=on?'flex':'none';
  const t=document.getElementById('capTop'), b=document.getElementById('capBottom');
  if(t) t.style.display=d; if(b) b.style.display=d;
}
function countBookUserMoves(){   // user plies inside the longest matching repertoire prefix
  let best=0;
  DATA.openings.forEach(op=>op.lines.forEach(l=>{
    let m=0; while(m<l.moves.length && m<playHist.length && l.moves[m].u===playHist[m].u) m++;
    let mine=0; for(let j=0;j<m;j++){ if((j%2===0)===(playerSide==='w')) mine++; }
    best=Math.max(best,mine);
  }));
  return best;
}
function finishPlay(status){
  playOver=true; locked=true;
  let msg, userLost=false;
  if(status==='checkmate'){
    const loserWhite=playWhite; userLost = (loserWhite===(playerSide==='w'));
    if(userLost) SFX.mateLose(); else SFX.mateWin();
    msg = userLost ? t('checkmateLose') : t('checkmateWin');
  } else {
    SFX.success();
    msg = t(status==='stalemate'?'stalemate' : status==='material'?'drawMaterial' : status==='repetition'?'drawRepetition' : 'drawFifty');
  }
  achCheck('play', {result: status==='checkmate' ? (userLost?'loss':'win') : 'draw', reason: status,
    elo: playElo, free: freeMode, plies: playHist.length, flags: playFlags,
    bookUserMoves: freeMode ? countBookUserMoves() : 0});
  flushMedals();
  setPrompt(status==='checkmate'?t('gameOverMate') : status==='stalemate'?t('gameOverStale') : t('gameOverDraw'), status==='checkmate'?'bad':'');
  document.getElementById('comment').innerHTML = msg + t('restartHint');
}
function lineMoves(){ return DATA.openings[curOp].lines[curLine].moves; }
function isPlayerTurn(){ return (ply%2===0?'w':'b')===playerSide; }

// Opponent replies speed up as the line becomes familiar (per-line perfect streak),
// so well-known lines feel fluid instead of waiting on a fixed delay.
function drillReplyDelay(){
  const st=store.get(curOp,curLine);
  return st.streak>=3 ? 260 : st.streak>=1 ? 400 : st.runs>0 ? 550 : 650;
}
function tick(){
  const moves=lineMoves();
  if(ply>=moves.length){ finishLine(); return; }
  if(isPlayerTurn()){
    setPrompt(t('drillYourMove',{side: playerSide==='w'?t('white'):t('black')}),'');
    locked=false;
  } else {
    locked=true;
    setPrompt(t('oppReplying'),'');
    setTimeout(()=>{
      const mv=moves[ply];
      const cap=isCapture(mv.u);
      applyMove(mv.u); ply++;
      playMoveSound(mv,cap);
      selSq=null; render(mv.u);
      showComment(mv);
      updateMoveList(); updateProgress();
      tick();
    }, ply===0?400:drillReplyDelay());
  }
}

function onSquare(name){
  if(locked) return;
  const [r,f]=sqRC(name); const p=board[r][f];
  let mine;
  if(mode==='play'){
    mine = p && (p===p.toUpperCase())===playWhite && userTurnInPlay();
  } else if(mode==='learn'){
    if(learnPly>=lineMoves().length) return;          // line finished: nothing to play
    const moverWhite = learnPly%2===0;                // whose move is next in the line
    mine = p && (p===p.toUpperCase())===moverWhite;
  } else {
    mine = p && ((p===p.toUpperCase()) === (playerSide==='w'));
  }
  const select = sq=>{ selSq=sq; aimSet = (sq&&showAims) ? new Set(legalTargetNames(sq)) : null; if(sq) buzz(8); render(curLastU()); };
  if(selSq===null){
    if(mine) select(name);
    return;
  }
  if(name===selSq){ select(null); return; }
  if(mine){ select(name); return; } // reselect own piece
  if(mode==='play'){
    if(!playUserMove(selSq+name)){ select(null); } // illegal target: deselect
    return;
  }
  if(mode==='learn'){ learnTryMove(selSq+name); return; }
  attemptMove(selSq+name);
}
function plyLastU(){ return ply>0 ? lineMoves()[ply-1].u : null; }

function attemptMove(u){
  const expected = lineMoves()[ply];
  if(u===expected.u.slice(0,4)){
    misses=0; selSq=null; aimSet=null; buzz(15); recalledThisRun++;
    const cap=isCapture(expected.u);
    applyMove(expected.u); ply++;
    playMoveSound(expected,cap);
    render(expected.u);
    setPrompt(`✓ ${expected.san} ${t('correctNow')}`,'good');
    showComment(expected);
    updateMoveList(); updateProgress();
    setTimeout(tick, drillReplyDelay());
  } else {
    misses++; mistakesThisRun++; selSq=null; aimSet=null;
    buzz([12,40,12]);
    SFX.error();
    boardEl.classList.remove('shake'); void boardEl.offsetWidth; boardEl.classList.add('shake');
    render(plyLastU());
    const reveal = misses>=2;
    if(reveal) revealedThisRun=true;
    setPrompt(reveal ? t('notQuite') : t('notTheLine'),'bad');
    document.getElementById('comment').innerHTML = explainWrong(u, expected, reveal);
    if(reveal) highlightSq(expected.u.slice(0,2));
    engineExplain(u, expected, reveal, ply); // async upgrade if engine is available
  }
}

/* If the engine is loaded, replace the rule-based note with a real evaluation.
   Guarded by token (ply + comment snapshot) so a late result can't overwrite a newer state. */
async function engineExplain(wrongU, expected, reveal, atPly){
  if(!(await Engine.load())) return;        // no engine → keep rule-based note
  if(mode!=='drill' || ply!==atPly) return; // position moved on
  const white = playerSide==='w';
  const fenBefore = toFEN(white);
  // best line from current position (engine's top choice + eval, from mover's POV)
  const before = await Engine.analyse(fenBefore, {movetime:500});
  if(!before || mode!=='drill' || ply!==atPly) return;
  // evaluate the position AFTER the user's wrong move (from opponent POV → negate)
  const wrong = wrongU.length>=4 ? wrongU.slice(0,4) : wrongU;
  let promo = '';
  const [r1,f1]=sqRC(wrong.slice(0,2));
  if(board[r1][f1].toUpperCase()==='P' && (wrong[3]==='8'||wrong[3]==='1')) promo='q';
  const b2=board.map(row=>row.slice()); applyTo(b2, wrong+promo);
  const sB=board; board=b2;
  const fenAfter=toFEN(!white);
  board=sB;
  const after = await Engine.analyse(fenAfter, {movetime:500});
  if(!after || mode!=='drill' || ply!==atPly) return;
  const playedCp = -after.cp;                 // back to our POV
  const bestCp = before.cp;
  const loss = bestCp - playedCp;             // centipawns thrown away
  const bestSan = before.bestmove ? uciToSan(before.bestmove) : null;
  const fmt = cp => (cp>=0?'+':'') + (cp/100).toFixed(1);
  let verdict;
  const lossP=(loss/100).toFixed(1);
  if(loss < 30) verdict = t('engEqual',{ev:fmt(playedCp)});
  else if(loss < 90) verdict = t('engInacc',{loss:lossP, pl:fmt(playedCp), best:fmt(bestCp)});
  else if(loss < 250) verdict = t('engMistake',{loss:lossP, pl:fmt(playedCp), best:fmt(bestCp)});
  else verdict = t('engBlunder',{loss:lossP, pl:fmt(playedCp), best:fmt(bestCp)});
  // This is a THEORY trainer: on reveal, the book move leads and the engine's
  // verdict on the user's move follows. The engine's own favourite move is
  // deliberately not shown — it often differs from the book move and teaching
  // two different "right answers" at once confuses beginners.
  if(reveal){
    document.getElementById('comment').innerHTML =
      `<b>${t('theLinePlays',{san:expected.san})}</b> ${mvC(expected)}` +
      `<br><br><span style="color:var(--accent2)">${t('engineSays')}</span> ${verdict}`;
  } else {
    document.getElementById('comment').innerHTML =
      `<span style="color:var(--accent2)">${t('engineSays')}</span> ${verdict}` +
      `<br><br>${pieceCueFor(expected)} <span style="color:var(--dim)">${t('tryAgainHint')}</span>`;
  }
}
// A hint that narrows the search without giving the move away.
function pieceCueFor(expected){
  if(expected.san.startsWith('O')) return t('cueCastle');
  const c=expected.san[0];
  const piece={N:t('pieceKnight'),B:t('pieceBishop'),R:t('pieceRook'),Q:t('pieceQueen'),K:t('pieceKing')}[c]||t('piecePawn');
  return t('pieceCue',{piece});
}

/* Analyze a wrong move and explain why, plus what the line wants. */
function explainWrong(wrongU, expected, reveal){
  const [r1,f1]=sqRC(wrongU.slice(0,2)), [r2,f2]=sqRC(wrongU.slice(2,4));
  const p=board[r1][f1];
  const dest=wrongU.slice(2,4);
  const pname={P:t('piecePawn'),N:t('pieceKnight'),B:t('pieceBishop'),R:t('pieceRook'),Q:t('pieceQueen'),K:t('pieceKing')}[p.toUpperCase()];
  const white = playerSide==='w';
  // simulate the wrong move on a copy
  const b2=board.map(row=>row.slice());
  if(p.toUpperCase()==='P'&&f1!==f2&&!b2[r2][f2]) b2[r1][f2]='';
  b2[r2][f2]=p; b2[r1][f1]='';
  let note;
  const attacked = attackedBy(b2, r2, f2, !white);
  const defended = attackedBy(b2, r2, f2, white);
  const captured = board[r2][f2] && (board[r2][f2]===board[r2][f2].toUpperCase())!==white;
  const val={P:1,N:3,B:3,R:5,Q:9,K:99};
  if(p.toUpperCase()!=='K' && attacked && !defended){
    note = t('hangWarn',{piece:pname, dest});
  } else if(p.toUpperCase()!=='K' && attacked && defended && val[p.toUpperCase()]>=5){
    note = t('tempoWarn',{piece:pname, dest});
  } else if(captured){
    note = t('captureWarn');
  } else if(p.toUpperCase()==='P' && Math.abs(f2-f1)===0){
    note = t('pawnLegal');
  } else {
    note = t('legalNotTheory');
  }
  if(reveal)
    return `<b>${t('theLinePlays',{san:expected.san})}</b> ${mvC(expected)}<br><br>${note}`;
  return `${note}<br><br>${pieceCueFor(expected)} <span style="color:var(--dim)">${t('tryAgainHint')}</span>`;
}

function giveHint(){
  hintsThisRun++;
  if(locked || ply>=lineMoves().length || !isPlayerTurn()) return;
  mistakesThisRun++; // hints cost the perfect run
  const exp=lineMoves()[ply];
  highlightSq(exp.u.slice(0,2));
  setPrompt(t('hintPrompt',{sq:exp.u.slice(0,2)}),'');
}
function highlightSq(name){
  const el=[...boardEl.children].find(s=>s.dataset.sq===name);
  if(el) el.classList.add('hint');
}

function finishLine(){
  locked=true;
  const preRank = lineRank(curOp,curLine);
  const perfect = mistakesThisRun===0;
  const st=store.record(curOp,curLine,perfect);
  activity.log();
  // FSRS grade: perfect on an established streak = easy, perfect = good, 1-2 slips = hard, more = again
  const g = perfect ? (st.streak>=3?4:3) : (mistakesThisRun<=2?2:1);
  const sv0=srs.get(curOp,curLine);
  const gapDays = sv0 ? Math.floor((Date.now()-sv0.last)/DAY_MS) : 0;
  const sv=srs.grade(curOp,curLine,g);
  const newRank = persistRank(curOp,curLine,preRank);
  const rankedUp = newRank>preRank;
  if(rankedUp) SFX.rankUp(); else if(perfect) SFX.perfect(); else SFX.success();
  const inDays=Math.max(1,Math.round((sv.due-Date.now())/DAY_MS));
  document.getElementById('promptBox').style.display='none';
  const box=document.getElementById('doneBox'); box.style.display='block';
  const banner=document.getElementById('rankUpBanner');
  if(banner){
    banner.className='r'+newRank;
    banner.style.display = rankedUp ? 'block' : 'none';
    if(rankedUp) banner.innerHTML = `${RANKS[newRank].icon} ${t('rankUp',{line: '<b>'+lnName(DATA.openings[curOp].lines[curLine])+'</b>', rank: t('rank'+newRank)})}`;
  }
  document.getElementById('doneMsg').innerHTML = perfect
    ? t('perfectRun')
    : t('slips',{n:mistakesThisRun});
  const revLeft = (reviewQueue&&reviewQueue.length) ? ` · ${t('reviewsLeft',{n:reviewQueue.length})}` : '';
  const hint = nextRankHint(curOp,curLine);
  document.getElementById('doneStats').innerHTML =
    `${rankChipHTML(newRank, rankRusty(newRank, sv))} ${t('runsPerfect',{p:st.perfect,r:st.runs})} · ${t('nextReview',{d:inDays})}${revLeft}` +
    (hint?`<br><span class="next-rank-hint">${hint}</span>`:'');
  document.getElementById('donePlan').innerHTML =
    `<b>${t('whatHappensAfter')}</b> ${lnPlan(DATA.openings[curOp].lines[curLine])}`;
  const rail=document.getElementById('readyRail');
  if(rail) rail.innerHTML = (reviewQueue&&reviewQueue.length) ? '' : readyRailHTML(readyNow(3, curOp+':'+curLine));
  document.getElementById('streakInfo').innerHTML = st.streak?`${t('perfectStreak')}<b>${st.streak}</b>`:'';
  achCheck('drill', {perfect, clean: perfect&&hintsThisRun===0&&!revealedThisRun, firstToday: !!st.firstRunToday,
    gapDays, lineLen: lineMoves().length, playerMoves: recalledThisRun});
  flushMedals();
}

function nextLine(){
  if(reviewQueue && reviewQueue.length){   // in a review session: next due line
    const x=reviewQueue.shift();
    startDrill(x.oi,x.li,DATA.openings[x.oi].side);
    return;
  }
  if(reviewQueue){ reviewQueue=null; showMenu(); return; }  // review session finished
  const op=DATA.openings[curOp];
  if(curLine+1 < op.lines.length) startDrill(curOp,curLine+1,playerSide);
  else if(curOp+1 < DATA.openings.length) startDrill(curOp+1,0,DATA.openings[curOp+1].side);
  else showMenu();
}

/* ================= REVIEW QUEUE ================= */
let reviewQueue=null;
function startReview(){
  reviewQueue=srs.dueList();
  if(!reviewQueue.length){ reviewQueue=null; showMenu(); return; }
  const x=reviewQueue.shift();
  startDrill(x.oi,x.li,DATA.openings[x.oi].side);
}

/* ================= UI helpers ================= */
function setPrompt(msg,cls){ const p=document.getElementById('prompt'); p.textContent=msg; p.className=cls; }
function showComment(mv){
  document.getElementById('comment').innerHTML=`<b>${mv.san}</b> — ${mvC(mv)}`;
  curAnnot = (mv.a||mv.k) ? {a:mv.a||[], k:mv.k||[]} : null;
  drawAnnots();
}
function shownPly(){ return mode==='learn' ? learnPly : ply; }
function updateMoveList(){
  const moves=lineMoves(); const n=shownPly(); let html='';
  for(let i=0;i<n;i++){
    if(i%2===0) html+=`<span class="num">${i/2+1}.</span>`;
    html+=`<span class="mv ${i===n-1?'cur':''}">${moves[i].san}</span> `;
  }
  document.getElementById('movelist').innerHTML = html || '<span style="color:var(--dim)">Moves will appear here.</span>';
  const ml=document.getElementById('movelist'); ml.scrollTop=ml.scrollHeight;
}
function updateProgress(){
  document.getElementById('progFill').style.width = (100*shownPly()/lineMoves().length)+'%';
}

/* ================= LEARN MODE ================= */
function startLearn(oi,li,side){
  rememberLast(oi,li,'learn');
  learnCredited=false; learnBadgeEarned=false; recalledThisRun=0;
  curOp=oi; curLine=li; playerSide=side; mode='learn';
  board=initBoard(); learnPly=0; selSq=null; aimSet=null; locked=false; curAnnot=null;
  document.getElementById('menu').style.display='none';
  document.getElementById('drill').style.display='flex';
  document.getElementById('doneBox').style.display='none';
  document.getElementById('promptBox').style.display='block';
  document.getElementById('drillNav').style.display='none';
  document.getElementById('learnNav').style.display='flex';
  document.getElementById('playNav').style.display='none';
  document.getElementById('strengthRow').style.display='none';
  showCapTrays(false);
  document.getElementById('evalBarWrap').style.display='none';
  document.getElementById('streakInfo').innerHTML='';
  const op=DATA.openings[oi], line=op.lines[li];
  document.getElementById('lineTitle').innerHTML=`${op.icon} ${opName(op)}<small>${lnName(line)} — ${t('learn')}</small>`;
  syncLineSel();
  learnShowStep();
  render();
}
// The next-move cue renders BELOW the explanation, so the reading order is:
// what happened → why it matters → what to play next. The green guide arrow on
// the board is still immediate for learners who just want to follow along.
function learnNextStrip(){
  const moves=lineMoves();
  if(learnPly>=moves.length) return '';
  const mv=moves[learnPly], num=Math.floor(learnPly/2)+1, isW=learnPly%2===0;
  return `<div class="next-strip">${t('playNext',{mv:`<b>${num}${isW?'.':'…'}${mv.san}</b>`})}</div>`;
}
function learnShowStep(){
  const line=DATA.openings[curOp].lines[curLine], moves=line.moves;
  learnGuide = learnPly<moves.length ? moves[learnPly].u.slice(0,4) : null;   // green guide arrow for the announced move
  if(learnPly===0){
    document.getElementById('prompt').innerHTML = '<span>'+t('overview')+'</span>';
    document.getElementById('prompt').className='';
    document.getElementById('comment').innerHTML = lnIntro(line) + learnNextStrip();
    curAnnot=null; drawAnnots();
  } else {
    const mv=moves[learnPly-1];
    const num=Math.ceil(learnPly/2), isW=learnPly%2===1;
    showComment(mv);
    if(learnPly===moves.length){
      setPrompt(`✓ ${mv.san} — ${t('lineComplete')}`,'good');
      if(!learnCredited){
        learnCredited=true;
        const pre=lineRank(curOp,curLine);
        store.markLearned(curOp,curLine); activity.log();
        if(persistRank(curOp,curLine,pre)>pre) learnBadgeEarned=true;
        achCheck('learn', {playerMoves: recalledThisRun});
        flushMedals();
      }
      const learnedNote = learnBadgeEarned ? `<br><br><span class="rank-chip r1">${RANKS[1].icon} ${t('rank1')}</span> ${t('learnedBadgeRest')}` : '';
      document.getElementById('comment').innerHTML += `${learnedNote}<br><br><b>${t('whatNext')}</b> ${lnPlan(line)}<br><br>${t('tryDrill')}`;
    } else {
      document.getElementById('comment').innerHTML += learnNextStrip();
      const p=document.getElementById('prompt');
      p.innerHTML = `<span>✓ ${num}${isW?'.':'...'}${mv.san}</span>`;
      p.className='good';
    }
  }
  updateMoveList(); updateProgress();
}
function nextStep(){
  const moves=lineMoves();
  if(learnPly>=moves.length) return;
  const mv=moves[learnPly];
  const cap=isCapture(mv.u);
  selSq=null; aimSet=null;
  applyMove(mv.u); learnPly++;
  playMoveSound(mv,cap);
  if(learnPly===moves.length) setTimeout(()=>SFX.success(), 200);   // line complete
  learnShowStep();
  render(mv.u);
}
function prevStep(){
  if(learnPly===0) return;
  selSq=null; aimSet=null;
  learnPly--;
  board=initBoard();
  for(let i=0;i<learnPly;i++) applyMove(lineMoves()[i].u);
  learnShowStep();
  render(learnPly>0 ? lineMoves()[learnPly-1].u : null);
}
// User plays a move on the board in Learn mode.
function learnTryMove(u){
  const expected=lineMoves()[learnPly];
  selSq=null; aimSet=null;
  if(u===expected.u.slice(0,4)){
    buzz(15); recalledThisRun++;
    nextStep();   // correct → advance with the explanation
  } else {
    boardEl.classList.remove('shake'); void boardEl.offsetWidth; boardEl.classList.add('shake');
    buzz([12,40,12]);
    SFX.error();
    render(curLastU());
    highlightSq(expected.u.slice(0,2));
    const p=document.getElementById('prompt');
    p.innerHTML = '<span>'+t('notTheOne',{san:expected.san})+'</span>';
    p.className='bad';
  }
}

renderMuteBtn();
(function initFindRow(){
  const sb=document.getElementById('searchBox');
  if(sb) sb.addEventListener('input', ()=>{ menuQuery=sb.value.trim().toLowerCase(); refreshMenuKeepScroll(); });
  document.querySelectorAll('#sortSeg button').forEach(b=>{
    b.onclick=()=>{ menuSort=b.dataset.sort; try{ localStorage.setItem('otSort',menuSort); }catch(e){}
      renderSortSeg(); refreshMenuKeepScroll(); };
  });
  renderSortSeg();
})();
buildLineSel();
applyStaticI18n();
document.getElementById(LANG==='zh'?'langZH':'langEN').classList.add('on');
renderAnnotBtn();
renderAimBtn();
renderEvalBtn();
updateEngineBadge();
setupSwipeBack();
showMenu();
// Offline shell: the manifest alone doesn't make a PWA work offline — the
// service worker does. file:// and headless test stubs are skipped.
if(typeof navigator!=='undefined' && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* Swipe right anywhere on the board screen → go back to the menu (one level up).
   Ignores gestures that start on interactive controls (slider, buttons, move list). */
function setupSwipeBack(){
  if(typeof document==='undefined' || !document.addEventListener) return;
  let s=null;
  document.addEventListener('touchstart', e=>{
    if(e.touches.length!==1){ s=null; return; }
    const x=e.touches[0].clientX;
    const el=e.target;
    if(el && el.closest && el.closest('input,select,button,#movelist,#lineSel,#board')){ s=null; return; }
    // Only an edge swipe counts: must START within the left 26px (like the OS back gesture).
    if(x>26){ s=null; return; }
    s={x, y:e.touches[0].clientY, t:Date.now()};
  }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(!s) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-s.x, dy=t.clientY-s.y, dt=Date.now()-s.t;
    s=null;
    // Require a long, fast, clearly-horizontal swipe that STARTED at the left edge.
    // (The edge-start requirement is what makes it un-triggerable by normal board taps/drags.)
    if(dx>110 && Math.abs(dy)<45 && dx>Math.abs(dy)*3 && dt<600){
      if(document.getElementById('drill').style.display!=='none') showMenu();
    }
  }, {passive:true});
}
