<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Debut — Chess Opening Trainer</title>
<!-- Install-to-home-screen / app metadata -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#241b12">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Debut">
<style>
:root {
  --bg: #241b12; --panel: #32271b; --panel2: #3e3122; --line: rgba(240,225,200,.14);
  --text: #f0e5d3; --dim: #b3a48e; --accent: #d08348; --accent2: #97a878;
  --bad: #d4715c; --light-sq: #e8d3ae; --dark-sq: #9a6b43;
  --hl: rgba(224,164,84,.55); --hl-last: rgba(224,164,84,.35);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif; min-height:100vh; }
::selection { background:rgba(208,131,72,.3); }
a { color:#e0a878; } a:hover { color:#ecc39a; }
button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
header { padding:max(18px, env(safe-area-inset-top, 0px)) 24px 10px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
header h1 { font-family:'Caprasimo',serif; font-weight:400; font-size:1.55rem; letter-spacing:0; cursor:pointer; user-select:none; transition:opacity .15s; }
header h1:hover { opacity:.8; }
header h1 span { color:var(--accent); }
header p { color:var(--dim); font-size:.9rem; }
.layout { display:flex; gap:20px; padding:10px 24px 30px; flex-wrap:wrap; align-items:flex-start; justify-content:center; }

/* ---- menu ---- */
#menu { max-width:1000px; width:100%; }
.op-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:14px; }
#buildTag { text-align:center; color:var(--dim); font-size:.72rem; margin-top:22px; opacity:.7; }
#buildTag b { color:var(--accent); }
#backupRow { text-align:center; margin-top:4px; }
#backupRow .linklike { background:none; border:none; color:var(--dim); cursor:pointer; font-size:.72rem;
  opacity:.8; text-decoration:underline dotted; padding:2px 4px; }
#backupRow .linklike:hover { color:#e0a878; opacity:1; }
/* Duolingo-style daily hero: streak front and center, actions beside it,
   engine play folded in as a compact side button. */
.today-hero { display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  background:#333d26; border:none; border-radius:20px; padding:13px 18px; margin-bottom:14px; }
.th-streak { display:flex; align-items:center; gap:10px; flex:0 0 auto; }
.th-streak svg { width:34px; height:34px; flex:0 0 auto; }
.th-streak.zero { opacity:.7; }
.th-streak.zero svg { stroke:#8a9a74; }
.th-num b { display:block; font-size:1.7rem; line-height:1; color:#f6ead2; }
.th-num span { color:#c3d1a6; font-size:.72rem; }
.th-main { flex:1; min-width:200px; display:flex; flex-direction:column; gap:7px; }
.th-stats { color:#c3d1a6; font-size:.88rem; }
.th-stats b { color:#f6ead2; }
.th-btns { display:flex; gap:8px; flex-wrap:wrap; }
.th-btns .tb-cont { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.th-engine { display:inline-flex; align-items:center; gap:7px; flex:0 0 auto;
  background:rgba(20,26,14,.35); color:#d8c9b0; border:1px solid rgba(240,225,200,.16); border-radius:999px;
  padding:8px 14px; cursor:pointer; font-size:.85rem; font-family:inherit; transition:border-color .15s; }
.th-engine:hover { border-color:var(--accent); color:var(--text); }
#findRow { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
#searchBox { flex:1; min-width:170px; background:var(--panel); border:1px solid var(--line); border-radius:999px;
  padding:9px 16px; color:var(--text); font-size:.95rem; font-family:inherit; }
#searchBox:focus { outline:none; border-color:var(--accent); }
#searchBox::placeholder { color:var(--dim); opacity:.8; }
.sort-seg { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--panel); }
.sort-seg button { background:transparent; color:var(--dim); border:none; padding:8px 13px; cursor:pointer; font-size:.8rem; font-family:inherit; }
.sort-seg button:hover { color:var(--text); }
.sort-seg button.on { background:var(--accent); color:#fbf3e4; font-weight:700; }
.no-results { grid-column:1 / -1; text-align:center; color:var(--dim); padding:26px 0; font-size:.95rem; }
.group-head { grid-column:1 / -1; font-size:.78rem; font-weight:700; letter-spacing:.1em;
  color:#a9bb8a; text-transform:uppercase; margin:10px 0 -4px; padding-left:2px; }
.group-head:first-child { margin-top:0; }
.op-card { background:var(--panel); border:none; box-shadow:0 2px 6px rgba(10,6,2,.4); border-radius:24px; padding:18px; }
.op-card.clickable { cursor:pointer; transition:box-shadow .15s, transform .15s; }
.op-card.clickable:hover { box-shadow:0 4px 12px rgba(10,6,2,.5); transform:translateY(-2px); }
.card-foot { font-size:.84rem; color:var(--dim); margin-top:4px; }
.op-card h2 { font-family:inherit; font-weight:700; font-size:1.05rem; display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; min-width:0; }
.op-card h2 .ico { font-size:1.4rem; color:var(--accent); }
.op-card .desc { color:var(--dim); font-size:.9rem; margin:6px 0 10px; line-height:1.45; }
.op-card h2 .fav-btn { margin-left:auto; background:none; border:none; cursor:pointer; font-size:1.2rem; line-height:1; color:var(--dim); padding:2px 4px; transition:transform .15s, color .15s; }
.op-card h2 .fav-btn:hover { transform:scale(1.25); color:var(--accent); }
.op-card h2 .fav-btn.on { color:var(--accent); }
.line-btn { display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left;
  background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:14px;
  padding:9px 14px; margin-top:6px; cursor:pointer; font-size:.88rem; font-family:inherit; transition:border-color .15s; }
.line-btn:hover { border-color:var(--accent); }
.line-btn .stat { font-size:.75rem; color:var(--dim); white-space:nowrap; margin-left:8px; }
.side-tag { font-size:.7rem; padding:2px 9px; border-radius:999px; margin-left:6px; vertical-align:middle; }
.side-w { background:#f0e5d3; color:#33281a; } .side-b { background:#1c1610; color:#d8c9b0; border:1px solid var(--line); }
.summary-bar { display:flex; gap:18px; flex-wrap:wrap; background:var(--panel); border:none; box-shadow:0 2px 6px rgba(10,6,2,.4);
  border-radius:24px; padding:12px 18px; margin:16px 0 16px; font-size:.85rem; color:var(--dim); }
.summary-bar b { color:var(--text); font-size:1.05rem; display:block; }

/* ---- drill ---- */
#drill { display:none; }
#boardCol { display:flex; flex-direction:row; align-items:center; justify-content:center; gap:8px; --bsize:min(92vw, calc(100vh - 170px), max(560px, calc(100vw - 470px)), 840px); }
#boardStack { display:flex; flex-direction:column; align-items:center; gap:6px; }
.board-wrap { position:relative; }
#evalBarWrap { display:none; width:20px; height:var(--bsize); position:relative; flex:0 0 auto;
  background:#171006; border:2px solid rgba(0,0,0,.45); border-radius:6px; overflow:hidden; }
#evalFill { position:absolute; left:0; right:0; bottom:0; height:50%; background:#f0e9da; transition:height .65s cubic-bezier(.22,.8,.36,1); }
#evalBarWrap::after { content:''; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(198,113,57,.7); }
#evalNum { position:absolute; left:0; right:0; top:3px; text-align:center; font-size:.52rem; font-weight:800;
  color:#f0e5d3; text-shadow:0 0 3px rgba(0,0,0,.75), 0 0 3px rgba(0,0,0,.75); z-index:2; }
.cap-tray { width:var(--bsize); min-height:22px; display:none; align-items:center; flex-wrap:wrap; }
.cap-tray .cap { display:inline-flex; align-items:center; font-size:23px; line-height:1; margin-right:-1px; }
.cap-tray .bp svg { filter:drop-shadow(0 0 2px rgba(255,246,230,.85)) drop-shadow(0 0 5px rgba(255,246,230,.35)); }  /* halo so dark pieces show on the wood panel */
.cap-tray .adv { margin-left:10px; font-weight:700; color:#a9bb8a; font-size:.9rem; }
#board {
  display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr);
  width:var(--bsize); height:var(--bsize);
  border:0; border-radius:16px; overflow:hidden; user-select:none;
  box-shadow:0 6px 20px rgba(0,0,0,.45); }
.sq { position:relative; display:flex; align-items:center; justify-content:center; cursor:pointer;
  font-size:calc(var(--bsize)/8*.80); line-height:1; min-width:0; min-height:0; }
.sq.anim-top { z-index:3; }
.sq.light { background:var(--light-sq); } .sq.dark { background:var(--dark-sq); }
.sq .pc { pointer-events:none; }
.pc { display:inline-flex; }
.pc svg { width:1em; height:1em; display:block; filter:drop-shadow(0 1px 1px rgba(32,30,29,.3)); }
.sq.sel::after, .sq.hint::after, .sq.last::after { content:''; position:absolute; inset:0; z-index:0; }
.sq .pc { position:relative; z-index:1; }
.sq.sel::after { background:var(--hl); }
.sq.last::after { background:var(--hl-last); }
.sq.hint::after { box-shadow:inset 0 0 0 4px var(--accent); }
.sq.mv::before { content:''; position:absolute; inset:35%; border-radius:50%;
  background:rgba(22,13,4,.26); z-index:2; pointer-events:none; }
.sq.cp::before { content:''; position:absolute; inset:4%; border-radius:50%;
  border:calc(var(--bsize)*.011) solid rgba(22,13,4,.26); z-index:2; pointer-events:none; }
.sq .coord { position:absolute; font-size:calc(var(--bsize)/8*.17); font-weight:700; opacity:.75; pointer-events:none; }
.sq .coord.file { right:3px; bottom:2px; } .sq .coord.rank { left:3px; top:2px; }
.sq.light .coord { color:var(--dark-sq); } .sq.dark .coord { color:var(--light-sq); }
#board.shake { animation:shake .35s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
.flash-bad { animation:flashbad .4s; }
@keyframes flashbad { 0%{background:var(--bad)} 100%{} }

.side-panel { width:330px; max-width:92vw; display:flex; flex-direction:column; gap:12px; }
.panel-box { background:var(--panel); border:none; box-shadow:0 2px 6px rgba(10,6,2,.4); border-radius:22px; padding:14px 18px; }
#lineTitle { font-size:1rem; font-weight:700; } #lineTitle small { color:var(--dim); display:block; font-size:.78rem; margin-top:2px; font-weight:400; }
#prompt { font-size:1.02rem; min-height:46px; display:flex; align-items:center; gap:8px; }
#prompt.good { color:#a9bb8a; } #prompt.bad { color:var(--bad); }
#comment { color:var(--dim); font-size:.95rem; line-height:1.55; min-height:60px; }
#comment b { color:#e0a878; }
#movelist { font-size:.92rem; line-height:1.9; color:var(--dim); max-height:140px; overflow-y:auto; }
#movelist .mv { color:var(--text); margin-right:2px; }
#movelist .num { color:var(--dim); margin:0 4px 0 8px; }
#movelist .cur { background:#4d3a20; border-radius:999px; padding:1px 7px; color:#f2cf9a; font-weight:700; }
.progressbar { height:6px; background:#453623; border-radius:999px; overflow:hidden; margin-top:10px; }
.progressbar div { height:100%; background:var(--accent); transition:width .25s; }
.btn-row { display:flex; gap:8px; flex-wrap:wrap; }
button.act { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:999px;
  padding:9px 16px; cursor:pointer; font-size:.92rem; font-family:inherit; transition:border-color .15s, background .15s; }
button.act:hover { border-color:var(--accent); background:#3e3122; }
button.act.primary { background:var(--accent); color:#fbf3e4; border-color:var(--accent); font-weight:700; }
button.act.primary:hover { background:#bb6f36; }
.streak { font-size:.8rem; color:var(--dim); }
.streak b { color:#a9bb8a; }
#doneBox { display:none; text-align:center; }
#doneBox .big { display:flex; justify-content:center; margin-bottom:8px; }
#doneBox .win-ico { width:54px; height:54px; border-radius:999px; background:#4d3a20; color:#e0a878;
  display:inline-flex; align-items:center; justify-content:center; }
#doneBox p { color:var(--dim); font-size:.88rem; margin-bottom:12px; }
.toggle { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--panel); }
.toggle button { background:transparent; color:var(--dim); border:none; padding:7px 14px; cursor:pointer; font-size:.82rem; font-family:inherit; }
.toggle button.on { background:var(--accent); color:#fbf3e4; font-weight:700; }
#overlay { position:absolute; left:0; top:0; width:var(--bsize); height:var(--bsize);
  pointer-events:none; z-index:5; }
#overlay line { stroke:rgba(224,164,84,.9); stroke-width:.14; }
#overlay line.guide { stroke:rgba(163,182,128,.95); }
#overlay line.user { stroke:rgba(106,164,73,.85); }
#overlay circle { fill:none; stroke:rgba(163,182,128,.9); stroke-width:.07; }
#overlay circle.user { stroke:rgba(106,164,73,.9); stroke-width:.08; }
.line-row { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; width:100%; background:var(--panel2);
  border:1px solid var(--line); border-radius:14px; padding:8px 12px; margin-top:6px; font-size:.93rem;
  box-sizing:border-box; overflow:hidden; }
.line-row.faved { border-left:3px solid var(--accent); border-radius:4px 14px 14px 4px; background:rgba(208,131,72,.12); }
.due-tag { color:#e0a878; font-weight:700; font-size:.7rem; }
.day-streak b { color:var(--accent); }
.today-bar { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; justify-content:space-between;
  background:#333d26; border:none; border-radius:24px; padding:13px 18px; margin-bottom:14px; }
.tb-stats { font-size:.9rem; color:#c3d1a6; } .tb-stats b { color:#f6ead2; font-size:1rem; }
.tb-btns { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.tb-cont { max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.group-head.clickable { cursor:pointer; user-select:none; }
.group-head.clickable:hover { color:#e0a878; }
.group-head .caret { margin-right:6px; color:var(--accent); }
.group-head .g-count { margin-left:8px; color:var(--dim); font-weight:400; font-size:.72rem; letter-spacing:0; text-transform:none; }
.op-prog-row { display:flex; align-items:center; gap:8px; margin-top:8px; }
.op-prog { flex:1; height:6px; background:#453623; border:none; border-radius:999px; overflow:hidden; }
.op-prog-fill { height:100%; background:var(--accent2); border-radius:999px; transition:width .3s; }
.op-prog-n { font-size:.85rem; color:var(--dim); letter-spacing:1px; white-space:nowrap; }
.op-prog-fill.full { background:#f2cf9a; }
.rank-chip { display:inline-block; font-size:.72rem; font-weight:700; padding:2px 9px; border-radius:999px;
  background:#453623; color:#c9bba3; white-space:nowrap; border:1px solid var(--line); }
.rank-chip.rusty { opacity:.55; }
.tier-count b { display:inline; font-size:inherit; color:inherit; margin-left:3px; }
.rank-legend { flex-basis:100%; color:var(--dim); font-size:.72rem; opacity:.8; letter-spacing:.3px; }
.mature-pip { font-size:.7rem; color:var(--dim); background:#3f3222; border-radius:999px; padding:2px 8px; white-space:nowrap; }
.prove-chip { font-size:.7rem; font-weight:700; color:#c3d1a6; background:#333d26; border-radius:999px; padding:2px 8px;
  white-space:nowrap; box-shadow:0 0 8px rgba(163,182,128,.3); }
.deep-note { opacity:.85; }
.rest-note { color:var(--dim); font-size:.85rem; }
.rail-title { font-weight:700; font-size:.85rem; margin:14px 0 6px; color:#a9bb8a; }
.rail-row { display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%; text-align:left;
  background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:14px;
  padding:8px 12px; margin-top:6px; cursor:pointer; font-size:.85rem; font-family:inherit; }
.rail-row:hover { border-color:var(--accent); }
.rail-payoff { color:var(--dim); font-size:.75rem; white-space:nowrap; }
.rail-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.medal-btn { display:inline-flex; align-items:center; gap:5px; background:var(--panel2); color:#e0a878;
  border:1px solid var(--line); border-radius:999px; padding:5px 12px; cursor:pointer; font-size:.8rem; font-family:inherit; }
.medal-btn:hover { border-color:var(--accent); }
.medal-btn b { display:inline; font-size:inherit; color:inherit; }
.m-dot { width:12px; height:12px; border-radius:999px; flex:0 0 auto; display:inline-block; }
.m-dot.b { background:#a97b50; } .m-dot.s { background:#c9c2b5; } .m-dot.g { background:#f2cf9a; box-shadow:0 0 6px rgba(242,207,154,.5); }
#medalToast { position:fixed; top:14px; left:50%; transform:translate(-50%,-80px); z-index:60;
  display:flex; align-items:center; gap:9px; background:var(--panel); color:var(--text);
  border:1px solid var(--line); border-radius:999px; padding:9px 18px; box-shadow:0 6px 20px rgba(0,0,0,.5);
  transition:transform .35s ease; pointer-events:none; }
#medalToast.show { transform:translate(-50%,0); }
#medalToast .m-sub { color:var(--dim); font-size:.78rem; }
#medalsOverlay { position:fixed; inset:0; z-index:50; background:rgba(12,8,4,.6); display:flex;
  align-items:center; justify-content:center; padding:18px; }
.medals-panel { background:var(--panel); border-radius:24px; box-shadow:0 10px 40px rgba(0,0,0,.6);
  max-width:480px; width:100%; max-height:82vh; display:flex; flex-direction:column; overflow:hidden; }
.medals-head { display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); }
.medals-head b { font-size:1.05rem; }
.medals-count { color:var(--dim); margin-left:auto; }
.medals-list { overflow-y:auto; padding:8px 18px 16px; }
.medal-row { display:flex; align-items:center; gap:11px; padding:8px 0; opacity:.45; }
.medal-row.got { opacity:1; }
.medal-row .m-txt { display:flex; flex-direction:column; min-width:0; }
.medal-row .m-txt span { color:var(--dim); font-size:.78rem; }
.medal-row.series { opacity:1; }
.medal-row.series:not(.got) .m-txt { opacity:.6; }
.m-dots { display:flex; gap:3px; flex:0 0 auto; align-items:center; }
.m-dot.off { opacity:.25; }
.m-prog { height:4px; background:#3f3222; border-radius:999px; overflow:hidden; margin-top:4px; width:150px; }
.m-prog-fill { height:100%; background:var(--accent); border-radius:999px; }
.m-prog-n { color:var(--dim); font-size:.72rem; margin-top:2px; }
.rank-chip.r2 { color:#d8c9b0; background:#4a3b27; }
.rank-chip.r3 { color:#a9bb8a; background:#39412a; }
.rank-chip.r4 { color:#e0a878; background:#4d3a20; }
.rank-chip.r5 { color:#f2cf9a; background:#553f1d; box-shadow:0 0 8px rgba(242,207,154,.25); }
.stat-row .due-tag { margin-left:4px; }
.next-rank-hint { color:var(--dim); font-size:.8rem; }
.next-strip { margin-top:12px; padding:8px 12px; border-left:3px solid var(--accent2);
  background:rgba(163,182,128,.08); border-radius:4px 12px 12px 4px; color:var(--dim); font-size:.9rem; }
.next-strip b { color:var(--text); }
.tier-counts { display:flex; gap:10px; align-items:center; }
.tier-count { font-size:.85rem; color:var(--dim); }
.tier-count b { margin-left:3px; }
.tier-count.r3 { color:#a9bb8a; } .tier-count.r4 { color:#e0a878; } .tier-count.r5 { color:#f2cf9a; }
.rep-strength b { color:#f2cf9a; font-size:1.05rem; }
#rankUpBanner { margin:0 auto 12px; padding:10px 16px; border-radius:14px; background:#39412a; color:#c3d1a6;
  font-weight:700; max-width:420px; animation:rankpop .5s ease; }
#rankUpBanner.r4 { background:#4d3a20; color:#e0a878; }
#rankUpBanner.r5 { background:#553f1d; color:#f2cf9a; box-shadow:0 0 14px rgba(242,207,154,.3); }
@keyframes rankpop { 0%{transform:scale(.85);opacity:0} 60%{transform:scale(1.06)} 100%{transform:scale(1)} }
.hm-wrap { display:flex; align-items:center; gap:12px; background:var(--panel); border:none; box-shadow:0 2px 6px rgba(10,6,2,.4);
  border-radius:18px; padding:10px 16px; margin-bottom:14px; overflow-x:auto; }
.hm-title { font-size:.75rem; color:var(--dim); white-space:nowrap; flex:0 0 auto; }
.hm-grid { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,10px); gap:2px; }
.hm-cell { width:10px; height:10px; border-radius:3px; background:#3f3222; }
.hm-cell.l1 { background:rgba(208,131,72,.3); }
.hm-cell.l2 { background:rgba(208,131,72,.55); }
.hm-cell.l3 { background:rgba(208,131,72,.8); }
.hm-cell.l4 { background:var(--accent); }
.review-btn { background:var(--accent); color:#fbf3e4; border:none; border-radius:999px; padding:7px 16px;
  font-weight:700; font-size:.82rem; font-family:inherit; cursor:pointer; transition:transform .15s, background .15s; }
.review-btn:hover { background:#bb6f36; transform:translateY(-1px); }
.ln-fav { background:none; border:none; cursor:pointer; font-size:1rem; line-height:1; color:var(--dim);
  padding:0 2px; flex:0 0 auto; transition:transform .15s, color .15s; }
.ln-fav:hover { transform:scale(1.25); color:var(--accent); }
.ln-fav.on { color:var(--accent); }
.ln-info { flex:1 1 130px; min-width:0; display:flex; flex-direction:column; gap:2px; }
.line-row .nm { overflow-wrap:anywhere; line-height:1.3; }
.line-row .stat { font-size:.72rem; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ln-btns { display:flex; gap:6px; flex:0 0 auto; margin-left:auto; }
button.mini { background:var(--panel); border:1px solid var(--line); color:#c9bba3; border-radius:999px;
  padding:4px 0; min-width:56px; text-align:center; cursor:pointer; font-size:.78rem; font-family:inherit;
  transition:all .15s; flex:0 0 auto; white-space:nowrap; }
button.mini:hover { border-color:var(--accent); color:var(--text); }
#lineSel { flex:1; min-width:0; background:var(--panel); color:var(--text); border:1px solid var(--line);
  border-radius:999px; padding:6px 12px; font-size:.82rem; font-family:inherit; cursor:pointer; }
#lineSel:hover { border-color:var(--accent); }
#donePlan { text-align:left; color:var(--dim); font-size:.85rem; line-height:1.5; margin-bottom:12px; }
#donePlan b { color:#e0a878; }
.eng-badge { font-size:.74rem; color:var(--dim); padding:3px 10px; border-radius:999px; }
.eng-badge.ready { color:#a9bb8a; }
.eng-badge.loading { color:#e0a878; }
.eng-badge.unavailable { color:var(--bad); cursor:pointer; }
.eng-badge.unavailable:hover { text-decoration:underline; }
#langBar { display:inline-flex; gap:4px; }
#langBar button { background:var(--panel); color:var(--dim); border:1px solid var(--line); border-radius:999px;
  padding:4px 11px; cursor:pointer; font-size:.78rem; font-family:inherit; line-height:1; }
#langBar button.on { background:var(--accent); color:#fbf3e4; font-weight:700; border-color:var(--accent); }
#muteBtn { margin-left:0; background:none; border:none; cursor:pointer; padding:4px;
  color:var(--dim); opacity:.7; transition:opacity .15s; line-height:1; }
#muteBtn:hover { opacity:1; }
#muteBtn svg { width:20px; height:20px; display:block; stroke:currentColor; fill:none;
  stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
@media (max-width:900px){ .layout{padding:10px 12px 24px} .side-panel{width:min(82vw,520px)} }

/* ---- phone layout: keep board + prompt + primary buttons on one screen ---- */
@media (max-width:760px){
  header { padding:max(14px, calc(env(safe-area-inset-top, 0px) + 8px)) 14px 6px; gap:8px; }
  header h1 { font-size:1.2rem; }
  header p { display:none; }
  .layout { padding:6px 8px 16px; gap:10px; }
  #drill { gap:8px; }
  #boardCol { --bsize:min(96vw, calc(100dvh - 286px - env(safe-area-inset-top, 0px))); }
  .side-panel { width:100%; max-width:100%; gap:8px; display:flex; flex-direction:column; }
  .panel-box { padding:10px 14px; }
  #promptBox { order:1; max-height:30vh; overflow:auto; }
  #doneBox   { order:1; }
  #drillNav, #learnNav, #playNav { order:2; }
  #streakInfo { order:3; }
  #titleBox  { order:4; }
  #moveBox   { order:5; }
  #lineTitle { font-size:.92rem; }
  #lineTitle small { font-size:.74rem; }
  #prompt { font-size:.97rem; min-height:0; margin-bottom:4px; }
  #comment { font-size:.92rem; min-height:0; }
  #movelist { max-height:84px; }
  button.act { padding:10px 12px; font-size:.82rem; flex:1 1 auto; }
  .btn-row { gap:6px; }
  .toggle { flex:1 1 100%; }
  .toggle button { flex:1; }
}
@media (max-width:760px) and (max-height:680px){
  #boardCol { --bsize:min(86vw, calc(100dvh - 276px - env(safe-area-inset-top, 0px))); }
  #promptBox { max-height:24vh; }
}

<body>
<header>
  <h1 id="logo" onclick="showMenu()" title="Back to main menu">♞ De<span>but</span></h1>
  <p data-i18n="tagline">Chess opening trainer — learn the lines, then drill them from memory.</p>
  <span id="engineBadge" class="eng-badge" onclick="retryEngine()" title="Engine status — click to retry"></span>
  <span id="langBar"><button id="langEN" onclick="setLang('en')">EN</button><button id="langZH" onclick="setLang('zh')">中文</button></span>
  <button id="muteBtn" onclick="toggleMute()" title="Toggle sound"></button>
</header>

<div class="layout">
  <!-- ============ MENU ============ -->
  <div id="menu">
    <div id="todayBar" class="today-bar" style="display:none"></div>
    <div id="findRow">
      <input id="searchBox" type="search" autocomplete="off" data-i18n-ph="searchPh">
      <div class="sort-seg" id="sortSeg">
        <button data-sort="group" data-i18n="sortGroup">Groups</button>
        <button data-sort="az">A–Z</button>
        <button data-sort="prog" data-i18n="sortProg">Progress</button>
        <button data-sort="due" data-i18n="sortDue">Due</button>
      </div>
    </div>
    <div class="op-grid" id="opGrid"></div>
    <div class="summary-bar" id="summaryBar"></div>
    <div id="heatmapBox"></div>
    <div id="buildTag">Debut · build <b>G8 · Organic</b> · 中文</div>
    <div id="backupRow">
      <button class="linklike" data-i18n="backupExport" onclick="exportProgress()"></button>
      <span style="color:var(--dim);opacity:.5">·</span>
      <button class="linklike" data-i18n="backupImport" onclick="importProgress()"></button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none">
    </div>
  </div>

  <!-- ============ DRILL ============ -->
  <div id="drill" class="layout" style="padding:0;">
    <div id="boardCol">
      <div id="evalBarWrap"><div id="evalFill"></div><span id="evalNum"></span></div>
      <div id="boardStack">
        <div id="capTop" class="cap-tray"></div>
        <div class="board-wrap"><div id="board"></div><svg id="overlay" viewBox="0 0 8 8"></svg></div>
        <div id="capBottom" class="cap-tray"></div>
      </div>
    </div>
    <div class="side-panel">
      <div class="panel-box" id="titleBox">
        <div id="lineTitle"></div>
        <div class="progressbar"><div id="progFill" style="width:0%"></div></div>
        <div style="display:flex;gap:8px;margin-top:10px;align-items:center">
          <select id="lineSel" onchange="onLineSel(this.value)"></select>
          <button class="mini" id="annotBtn" onclick="toggleAnnots()" title="Show or hide arrows and key-square markers"></button>
          <button class="mini" id="aimBtn" onclick="toggleAims()" title="Show or hide legal-move dots when you select a piece"></button>
        </div>
        <div id="strengthRow" style="display:none;margin-top:10px">
          <label style="font-size:.78rem;color:var(--dim);display:flex;justify-content:space-between">
            <span data-i18n="engineStrength">Engine strength</span><span id="eloLabel"></span>
          </label>
          <input type="range" id="eloSlider" min="500" max="2400" step="50" value="1000" oninput="onEloInput(this.value)" style="width:100%">
          <button class="mini" id="evalBtn" onclick="toggleEvalBar()" title="Show or hide the engine evaluation bar" style="margin-top:8px"></button>
        </div>
      </div>
      <div class="panel-box" id="promptBox">
        <div id="prompt"></div>
        <div id="comment"></div>
      </div>
      <div class="panel-box" id="doneBox">
        <div id="rankUpBanner" style="display:none"></div>
        <div class="big"><span class="win-ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg></span></div>
        <div id="doneMsg"></div>
        <p id="doneStats"></p>
        <div id="donePlan"></div>
        <div id="readyRail"></div>
        <div class="btn-row" style="justify-content:center">
          <button class="act primary" data-i18n="drillAgain" onclick="startDrill(curOp,curLine,playerSide)">Drill Again</button>
          <button class="act" data-i18n="playVsEngine" onclick="startPlay(curOp,curLine,playerSide)">♟ Play vs Engine</button>
          <button class="act" data-i18n="nextLine" onclick="nextLine()">Next Line →</button>
          <button class="act" data-i18n="lines" onclick="backToLines()">← Lines</button>
        </div>
      </div>
      <div class="panel-box" id="moveBox">
        <div id="movelist">&nbsp;</div>
      </div>
      <div class="btn-row" id="drillNav">
        <button class="act" id="hintBtn" data-i18n="hint" onclick="giveHint()">Hint</button>
        <button class="act" data-i18n="restart" onclick="startDrill(curOp,curLine,playerSide)">↻ Restart</button>
        <span class="toggle" id="sideToggle">
          <button id="sideW" data-i18n="playWhite" onclick="switchSide('w')">Play White</button>
          <button id="sideB" data-i18n="playBlack" onclick="switchSide('b')">Play Black</button>
        </span>
        <button class="act" data-i18n="lines" onclick="backToLines()">← Lines</button>
      </div>
      <div class="btn-row" id="learnNav" style="display:none">
        <button class="act" data-i18n="back" onclick="prevStep()">◀ Back</button>
        <button class="act primary" data-i18n="next" onclick="nextStep()">Next ▶</button>
        <button class="act" data-i18n="drillThisLine" onclick="startDrill(curOp,curLine,playerSide)">Drill This Line</button>
        <button class="act" data-i18n="lines" onclick="backToLines()">← Lines</button>
      </div>
      <div class="btn-row" id="playNav" style="display:none">
        <button class="act" id="engMoveBtn" data-i18n="engineMove" onclick="engineMoveNow()" title="Let the engine move for you">↻ Engine move</button>
        <button class="act" id="playRestartBtn" data-i18n="restartGame">↺ Restart game</button>
        <button class="act" id="playDrillBtn" data-i18n="backToDrill" onclick="startDrill(curOp,curLine,playerSide)">Back to Drill</button>
        <button class="act" data-i18n="menu" onclick="showMenu()">← Menu</button>
      </div>
      <div class="streak" id="streakInfo"></div>
    </div>
  </div>
</div>

<script>
/* ================= DATA (validated move sequences) ================= */
const DATA = {"openings":[{"name":"Italian Game","side":"w","icon":"♗","desc":"One of the oldest openings. White develops quickly and aims the bishop at f7, Black's weakest square.","lines":[{"name":"Giuoco Piano (Main Line)","intro":"The 'quiet game' is the perfect first opening: every move follows the golden rules — fight for the center, develop a new piece each move, castle early. Both sides build sound positions before any fighting starts.","plan":"After both sides castle, White's classic plan is the slow build-up: Re1, Nbd2, then reroute the knight Nf1–g3 toward the kingside, and eventually push d4 in one go. Black mirrors with ...Re8 and ...a6, ...Ba7 keeping the bishop. The key battleground squares are d5 and f5 — whoever plants a knight there first usually gets the better middlegame. Avoid trading your good bishop on c4/c5 without getting something for it.","moves":[{"u":"e2e4","san":"e4","c":"Push the king's pawn two squares to claim your share of the center. This one move opens paths for both your queen and your f1-bishop, and the pawn controls the key squares d5 and f5.","k":["d5","f5"]},{"u":"e7e5","san":"e5","c":"Black answers in kind, taking an equal share of the center. The position stays symmetrical, so both sides will fight fairly over the same central squares."},{"u":"g1f3","san":"Nf3","c":"Develop (bring a piece off the back rank) with a threat: the knight attacks Black's e5 pawn. This is developing 'with tempo' — your opponent must stop and deal with your threat, so you gain time.","a":["f3e5"]},{"u":"b8c6","san":"Nc6","c":"The most natural reply: Black defends e5 and develops a knight at the same time. Guarding with a piece is better than a pawn move like ...d6, which would block the dark-squared bishop.","a":["c6e5"]},{"u":"f1c4","san":"Bc4","c":"The signature Italian move: the bishop takes its best diagonal and points straight at f7 — the one square only Black's king defends. Countless beginner-level attacks and traps target f7, so keep an eye on it.","a":["c4f7"],"k":["f7"]},{"u":"f8c5","san":"Bc5","c":"Black copies the idea, pointing a bishop at White's f2 in return. The bishop also watches d4, making it harder for White to push a pawn there and expand in the center.","a":["c5f2"],"k":["f2","d4"]},{"u":"c2c3","san":"c3","c":"A pawn move with a purpose: it prepares d4 so White can build a big center. Notice White waited until the key pieces were out — pushing pawns before developing is a common beginner mistake.","k":["d4"]},{"u":"g8f6","san":"Nf6","c":"Black brings out the last minor piece (knight or bishop) needed before castling, and the knight attacks White's e4 pawn. If White gets careless, ...Nxe4 simply wins that pawn.","a":["f6e4"]},{"u":"d2d3","san":"d3","c":"White calmly defends the e4 pawn. Playing d4 right away leads to sharp, tricky positions; d3 keeps the center stable, and White can still prepare d4 properly later. Slower, but safe.","k":["e4"]},{"u":"d7d6","san":"d6","c":"Black protects the e5 pawn the same way. Both sides have now met the opening's first goals: a stable center and pieces ready so the king can castle.","k":["e5"]},{"u":"e1g1","san":"O-O","c":"Castle! Tucking the king into safety always comes before launching an attack. As a bonus, the rook steps toward the central files, where it will do its best work.","k":["g1","f1"]},{"u":"e8g8","san":"O-O","c":"Black castles too, and both kings are safe. The opening phase is complete — the real game begins now. Check the strategy notes when you finish this line."}]},{"name":"Two Knights Defense (Quiet)","intro":"When Black plays 3...Nf6 instead of 3...Bc5, they counterattack e4 immediately. White's calmest answer is d3, sidestepping the wild Fried Liver complications while keeping a healthy, flexible position.","plan":"White's setup is identical to the Giuoco Piano: c3, Re1, Nbd2–f1–g3, then the d4 break. Black's most active plan is ...d5 in one move if White is slow, or the standard ...a6, ...Ba7 regroup. Watch for the moment Black plays ...d5: after exd5 Nxd5 you should hit the center quickly before Black consolidates.","moves":[{"u":"e2e4","san":"e4","c":"Push the king's pawn to take the center and open paths for your queen and bishop.","k":["d5","f5"]},{"u":"e7e5","san":"e5","c":"Black grabs an equal share of the center."},{"u":"g1f3","san":"Nf3","c":"Develop (bring a piece off the back rank) and attack the e5 pawn — Black must stop and deal with this threat.","a":["f3e5"]},{"u":"b8c6","san":"Nc6","c":"Black defends e5 with a piece while developing a knight — two jobs in one move."},{"u":"f1c4","san":"Bc4","c":"The Italian bishop takes aim at f7, the one square only Black's king defends.","a":["c4f7"],"k":["f7"]},{"u":"g8f6","san":"Nf6","c":"The Two Knights Defense: instead of copying White, Black attacks the e4 pawn right away. It's a fighting choice — it even invites White to grab material with Ng5, which leads to wild complications.","a":["f6e4"]},{"u":"d2d3","san":"d3","c":"The calm, mature choice. 4.Ng5 attacks f7 and wins material by force, but the play turns razor-sharp. d3 simply defends the e4 pawn and keeps a comfortable, easy-to-play game.","k":["e4"]},{"u":"f8e7","san":"Be7","c":"Black develops the bishop to a modest square. ...Bc5 was also fine and would steer toward Giuoco Piano positions, but Be7 is the most solid choice — on e7 the bishop never becomes a target.","k":["e7"]},{"u":"e1g1","san":"O-O","c":"Castle before anything else — king safety first. From here White's position almost plays itself: every piece has an obvious good square."},{"u":"e8g8","san":"O-O","c":"Black castles as well, finishing kingside development. Both kings are now safe."},{"u":"f1e1","san":"Re1","c":"The rook slides to the e-file before that file even opens. When the center finally breaks open — say after d4xe5 or Black's ...d5 — this rook will already be perfectly placed.","a":["e1e4"],"k":["e4"]},{"u":"d7d6","san":"d6","c":"Black strengthens the e5 pawn. Now both sides maneuver: White eyes d4 and the kingside, while Black looks for ...d5 or ...Be6 to trade off White's strong Italian bishop.","k":["d5"]}]},{"name":"Evans Gambit","intro":"A pawn sacrifice with a clear purpose: b4! deflects Black's bishop, then c3 and d4 build a massive center while Black wastes time with the same bishop. Beloved by attacking players from Morphy to Kasparov.","plan":"White's compensation is concrete: a big center, open lines, and a 2-3 move lead in development. Typical follow-ups are Qb3 (hitting f7), Ba3 (preventing castling!), and e5 kicking the f6-knight. The golden rule of gambit play: never trade queens, keep making threats, and open the position before Black untangles. If Black survives to an endgame, the extra pawn wins — so play with energy.","moves":[{"u":"e2e4","san":"e4","c":"Claim the center and open lines for your queen and bishop."},{"u":"e7e5","san":"e5","c":"Black takes an equal share of the center."},{"u":"g1f3","san":"Nf3","c":"Develop with tempo (a threat your opponent must answer): the knight attacks the e5 pawn.","a":["f3e5"]},{"u":"b8c6","san":"Nc6","c":"Black defends e5 with a piece and develops toward the center at the same time."},{"u":"f1c4","san":"Bc4","c":"The Italian bishop takes aim at f7, Black's weakest square.","a":["c4f7"],"k":["f7"]},{"u":"f8c5","san":"Bc5","c":"Black develops the bishop to c5, its classical square."},{"u":"b2b4","san":"b4","c":"The Evans Gambit! A gambit means offering a pawn for something bigger. White gives up this wing pawn to lure Black's bishop off its good diagonal and gain time — the tempo and the big center White gets matter more than the pawn.","a":["b4c5"]},{"u":"c5b4","san":"Bxb4","c":"Black takes the pawn — the critical test of the gambit. Declining with ...Bb6 is safer, but then White gains extra space for free."},{"u":"c2c3","san":"c3","c":"The point of the gambit: attack the bishop again to gain another tempo, and prepare the pawn push d4. Black's bishop is being forced to move for the third time, while White develops with every single move.","a":["c3b4"],"k":["d4"]},{"u":"b4a5","san":"Ba5","c":"The main retreat. On a5 the bishop keeps alive the idea of a pin against c3 (a pin freezes a piece in place). ...Be7 and ...Bc5 are alternatives, but each has drawbacks White can exploit."},{"u":"d2d4","san":"d4","c":"White's big center arrives, bringing yet another threat. Every white pawn and piece works together, while Black has only a knight and a bishop out — and that bishop has been chased all over the board.","a":["d4e5"],"k":["d4","e5"]},{"u":"e5d4","san":"exd4","c":"Black grabs a second pawn and falls even further behind in development. That greed is exactly what fuels White's attack in the Evans."},{"u":"e1g1","san":"O-O","c":"Calm in the storm: White castles, tucking the king away — which also frees the c3 pawn from the a5-bishop's pin — and prepares cxd4 or Qb3. Two pawns down but roughly four tempi (moves) ahead in development: in open positions, that trade wins games.","k":["f7","a3"]}]}]},{"name":"Ruy Lopez","side":"w","icon":"♘","desc":"The 'Spanish Game'. White pressures the knight that defends e5 — perhaps the most classical of all openings.","lines":[{"name":"Main Line (Closed)","intro":"The Ruy Lopez asks Black a long-term question: the b5-bishop pressures the c6-knight, the only defender of e5. White isn't threatening to win a pawn immediately — it's positional pressure that can last 30 moves.","plan":"The closed Spanish is a slow maneuvering battle. White's standard plan: h3 (stopping ...Bg4), d4, and the famous knight tour Nb1–d2–f1–g3 heading for f5. Black counters with ...Na5 hitting the bishop, ...c5 and ...Qc7 claiming queenside space. Don't rush — improve your worst piece each move. The e4/e5 pawn tension defines everything: whoever resolves it carelessly hands the other side the center.","moves":[{"u":"e2e4","san":"e4","c":"Push your king's pawn two squares to claim space in the center and open paths for your queen and bishop to develop (come off the back rank)."},{"u":"e7e5","san":"e5","c":"Black mirrors the move, claiming an equal share of the center. The most classical reply in chess."},{"u":"g1f3","san":"Nf3","c":"The knight develops to its best square and attacks the e5 pawn at the same time — a move with tempo, meaning Black must stop and deal with the threat.","a":["f3e5"]},{"u":"b8c6","san":"Nc6","c":"Black defends the e5 pawn with the knight while developing a piece toward the center. Two jobs with one move."},{"u":"f1b5","san":"Bb5","c":"The Spanish move. Unlike the Italian's direct attack on f7, this bishop targets the c6-knight — the only piece defending e5. The idea of Bxc6 followed by Nxe5 doesn't win a pawn just yet, but Black must watch for it on every single move.","a":["b5c6"],"k":["c6","e5"]},{"u":"a7a6","san":"a6","c":"The Morphy Defense — the pawn asks the bishop right away: take, or retreat? If White takes on c6, Black gets the bishop pair (two bishops working together); if it retreats, ...b5 can chase it again later. This move leads to the most-played position in all of chess."},{"u":"b5a4","san":"Ba4","c":"The bishop retreats but keeps the pressure: from a4 it still eyes c6 along the a4–e8 diagonal. And if Black ever plays ...b5 to chase it, those queenside pawns loosen up — a target for White's a4 push later on.","a":["a4c6"]},{"u":"g8f6","san":"Nf6","c":"Black develops the knight and attacks White's e4 pawn. Now White faces the very question Black just faced: defend the pawn, or ignore the threat?","a":["f6e4"]},{"u":"e1g1","san":"O-O","c":"Castle and ignore the threat! If Black grabs the e4 pawn (the 'Open Spanish'), White wins it back with d4 and Re1 — the rook pins Black's pieces on the open e-file (they can't move without exposing what's behind). A famous lesson: calculate, don't just react.","k":["e4"]},{"u":"f8e7","san":"Be7","c":"Black declines the pawn, develops the bishop, and prepares to castle. Safe and solid — the main road of the whole opening."},{"u":"f1e1","san":"Re1","c":"Now the rook truly defends e4, which renews the old threat: Bxc6 followed by Nxe5 really would win the e5 pawn. Black's next move is almost forced — can you see why?","a":["e1e4"],"k":["e4"]},{"u":"b7b5","san":"b5","c":"Black kicks the bishop and finally ends the pressure along the a4–e8 diagonal for good — the clean answer to White's renewed threat. The cost: the queenside pawns are slightly loosened, and White may attack them with a4 much later.","a":["b5a4"]},{"u":"a4b3","san":"Bb3","c":"The bishop settles into its permanent home. From b3 it stares at f7 — Black's weakest square — along the a2–g8 diagonal. In many lines it grows into the most dangerous piece on the board.","a":["b3f7"],"k":["f7"]},{"u":"d7d6","san":"d6","c":"A quiet building move: the pawn cements e5 and opens the path for Black's c8-bishop to come out."},{"u":"c2c3","san":"c3","c":"One pawn move, two ideas: it prepares the d4 push in the center, and creates an escape square on c2 so that ...Na5 can never win the bishop pair. Stopping the opponent's plan before it starts — that's called prophylaxis.","k":["d4","c2"]},{"u":"e8g8","san":"O-O","c":"Black castles to safety, and we reach the main-line tabiya (a standard position both sides aim for). White usually continues h3 then d4; Black picks a setup with ...Na5, ...Bb7, or ...Re8. Players explore this position for a lifetime."}]},{"name":"Exchange Variation","intro":"White trades the prized bishop for a clear, simple asset: Black's doubled c-pawns. The deep idea — in a pure pawn endgame White's healthy kingside majority creates a passed pawn, while Black's crippled queenside majority cannot. Bobby Fischer's favorite shortcut.","plan":"White's strategy is brutally clear: trade pieces (not pawns!), play d4, and aim for any endgame. Every exchange increases the value of the superior pawn structure. Black's compensation is the bishop pair — so Black should keep the position rich, avoid trades, and use the half-open d-file. As White: knight to the kingside, f4-f5 majority advance. Count to the endgame: 4 healthy pawns vs 3 beats 4 vs a doubled 4.","moves":[{"u":"e2e4","san":"e4","c":"Push the king's pawn two squares: claim the center and open lines for the queen and bishop to come out."},{"u":"e7e5","san":"e5","c":"Black mirrors the move, claiming an equal share of the center — the classical reply."},{"u":"g1f3","san":"Nf3","c":"The knight develops and attacks the e5 pawn in the same breath — a move with tempo, so Black must stop and defend.","a":["f3e5"]},{"u":"b8c6","san":"Nc6","c":"Black guards e5 with the knight while developing toward the center — defense and development in one move."},{"u":"f1b5","san":"Bb5","c":"The Spanish bishop attacks the c6-knight — the piece whose job is guarding e5. White pressures the defender rather than the pawn itself.","a":["b5c6"]},{"u":"a7a6","san":"a6","c":"The Morphy Defense: the little pawn immediately asks the bishop its intentions — capture the knight, or retreat?"},{"u":"b5c6","san":"Bxc6","c":"The Exchange: White gives up the strong bishop on purpose, in return for lasting damage to Black's pawns. The trade only makes sense because Black must take back with a pawn, creating doubled c-pawns (two pawns stuck on the same file).","k":["c6"]},{"u":"d7c6","san":"dxc6","c":"Black recaptures with the d-pawn — deliberately capturing away from the center: this opens the d-file for the queen and frees the c8-bishop. (...bxc6 would keep that bishop shut in and leave even weaker pawns.) Black's compensation: the two bishops promise active play.","k":["c6","c7"]},{"u":"e1g1","san":"O-O","c":"Castle first! Grabbing the pawn with 5.Nxe5? runs into ...Qd4!, a fork attacking the knight and the e4 pawn at once — Black regains the pawn with a fine game. A famous trap; set it up on a board and check it yourself.","k":["d4"]},{"u":"f7f6","san":"f6","c":"Black props up e5 with the f-pawn — ugly-looking, but solid. And the doubled pawns offer one gift: they control excellent central squares.","k":["e5"]},{"u":"d2d4","san":"d4","c":"Strike in the center while ahead in development. White wants to trade off the central pawns and steer the game toward the endgame, where White's healthier pawn structure shines.","a":["d4e5"]},{"u":"e5d4","san":"exd4","c":"Black trades pawns — trying to keep the pawn on e5 instead would sooner or later cost a pawn."},{"u":"f3d4","san":"Nxd4","c":"The knight recaptures — time to take stock. White has a healthy 4-vs-3 pawn majority on the kingside plus a lead in development; Black has the two bishops and free play on the fully open d-file. Remember as you play on: from here, every piece trade favors White.","k":["d4"]}]},{"name":"Berlin Defense","intro":"The 'Berlin Wall' — Black's most solid answer to the Spanish, famously used by Kramnik to dethrone Kasparov in 2000. Black accepts a slightly worse structure and loses castling rights, but gets the bishop pair and a fortress-like endgame with no weaknesses.","plan":"This IS the endgame — the queens come off by move 8. White's assets: the kingside pawn majority and Black's misplaced king. Black's assets: the bishop pair and a rock-solid structure. White should advance the kingside pawns (h3, g4, e5–e6 ideas) and activate rooks before Black coordinates. Black plays ...Ke8–c8, ...b6, ...Bb7 and simply outlasts. Patience wins here; haste loses.","moves":[{"u":"e2e4","san":"e4","c":"Push the king's pawn two squares: claim the center and open lines for the queen and bishop."},{"u":"e7e5","san":"e5","c":"Black mirrors the move, claiming an equal share of the center — the classical reply."},{"u":"g1f3","san":"Nf3","c":"The knight develops and attacks the e5 pawn at the same time — a move with tempo, forcing Black to stop and respond.","a":["f3e5"]},{"u":"b8c6","san":"Nc6","c":"Black defends e5 with the knight while bringing a piece toward the center."},{"u":"f1b5","san":"Bb5","c":"The Spanish bishop takes aim at the c6-knight — the piece guarding e5.","a":["b5c6"]},{"u":"g8f6","san":"Nf6","c":"The Berlin Defense: Black skips ...a6 and instead develops the knight, counterattacking the e4 pawn at once. It's an invitation to deep, technical play.","a":["f6e4"]},{"u":"e1g1","san":"O-O","c":"The principled reply: White castles instead of defending e4 with a pawn — tactics will protect it. White actually invites Nxe4, having calculated further ahead.","k":["e4"]},{"u":"f6e4","san":"Nxe4","c":"Black takes the pawn — but no trap is being sprung. This is all known theory: Black knows White will win the pawn back, and trusts the endgame ahead can be held. Watch how White regains it.","k":["e4"]},{"u":"d2d4","san":"d4","c":"The key move: before recapturing anything, White strikes in the center. The d4-pawn attacks e5, the push d5 would chase away the c6-knight (e5's defender), and once the center pawns trade, the queen's file opens toward d8 — Black cannot keep the extra pawn.","a":["d4e5"],"k":["d5"]},{"u":"e4d6","san":"Nd6","c":"The best retreat: the knight steps back and attacks the b5-bishop on the way, so the move comes with tempo — White must react. Nearly every Berlin move does two jobs like this, which is why the defense is so hard to crack.","a":["d6b5"]},{"u":"b5c6","san":"Bxc6","c":"An in-between move: before recapturing on e5, White grabs the knight first, damaging Black's pawn structure along the way.","k":["c6"]},{"u":"d7c6","san":"dxc6","c":"Black recaptures with the d-pawn, accepting doubled pawns in order to free the c8-bishop — the same structural bargain as in the Exchange Variation."},{"u":"d4e5","san":"dxe5","c":"White regains the pawn and kicks the d6-knight in the same move. Notice that the d-file is now completely open — and both queens are standing on it.","a":["e5d6"]},{"u":"d6f5","san":"Nf5","c":"The knight lands on its one good square: from f5 it eyes the d4 and e3 holes — weak squares in White's camp.","k":["d4","e3"]},{"u":"d1d8","san":"Qxd8+","c":"Queens come off — and that's exactly White's point: only Black's king can recapture, so Black loses the right to castle forever. Welcome to the famous Berlin endgame.","a":["d1d8"]},{"u":"e8d8","san":"Kxd8","c":"The Berlin Wall stands. Black's king is stuck in the center and the h8-rook is hard to bring into play — but the position has no weaknesses for White to attack. From here on it's patient, technical chess; see the strategy notes."}]}]},{"name":"Sicilian Defense","side":"b","icon":"♟","desc":"Black's most popular and combative reply to 1.e4. Fight for the center asymmetrically with the c-pawn.","lines":[{"name":"Najdorf Setup","intro":"The Najdorf is the Rolls-Royce of Sicilians — the choice of Fischer and Kasparov. The little move ...a6 prepares everything: ...e5 without allowing Nb5, and queenside expansion with ...b5. Black plays for a win from move one.","plan":"Black's typical scheme: ...e5 (or ...e6), ...Be7, ...O-O, then the thematic ...b5–b4 pawn storm against White's queenside — often racing White's own kingside attack. The d5-square is Black's eternal concern: never let a White knight live there. Remember the Sicilian golden rule: Black's counterplay runs down the half-open c-file (...Rc8, ...Qc7, pressure on c2/c3). If White castles long, the race is on — push those queenside pawns!","moves":[{"u":"e2e4","san":"e4","c":"White pushes the e-pawn two squares, grabbing space in the center — the most important part of the board."},{"u":"c7c5","san":"c5","c":"The Sicilian! Instead of copying White, Black fights for the d4 square with a flank pawn (a pawn on the side of the board). The point: when White later plays d4 and Black trades, Black swaps a flank pawn for a center pawn — a lasting structural profit.","k":["d4"]},{"u":"g1f3","san":"Nf3","c":"White develops the knight (brings it off the back rank) and prepares to push d4. This heads for the Open Sicilian — White's most challenging approach."},{"u":"d7d6","san":"d6","c":"This small pawn move does two jobs: it controls e5, stopping White's pawn from pushing e4-e5, and it opens the diagonal for Black's c8-bishop. This is the flexible Najdorf move order.","k":["e5"]},{"u":"d2d4","san":"d4","c":"White breaks open the center. White accepts giving up a center pawn for Black's flank pawn, and in return gets active pieces and a head start in development."},{"u":"c5d4","san":"cxd4","c":"The key trade: Black's flank pawn captures White's center pawn. Black also gains the half-open c-file (a file no longer blocked by a Black pawn) — the main road for all of Black's future counterplay.","k":["c2"]},{"u":"f3d4","san":"Nxd4","c":"White takes back with the knight, which now sits on a strong central square."},{"u":"g8f6","san":"Nf6","c":"Black develops the knight and attacks the e4 pawn at the same time — a move with tempo, meaning White must stop and deal with the threat.","a":["f6e4"]},{"u":"b1c3","san":"Nc3","c":"White guards e4 while developing another piece — the most natural way to answer the threat."},{"u":"a7a6","san":"a6","c":"The famous Najdorf move. It looks slow, but it takes the b5 square away from White's knights and bishop. That makes ...e5 safe (no more Nb5 jumping in) and prepares Black's own ...b5 push. One quiet pawn move sets up the whole middlegame.","k":["b5","e5"]}]},{"name":"Open Sicilian (Classical)","intro":"The Classical Sicilian: Black develops both knights to their best squares before committing any more pawns. Sound, flexible, and a great way to learn Open Sicilian structures without memorizing forcing lines.","plan":"Black's standard development: ...e6 (or ...g6), ...Be7, ...O-O, ...Qc7 and rooks to c8/d8. The recurring themes of every Open Sicilian apply: pressure down the c-file, a timely ...d5 break to free the position, and vigilance over the d5-square. White usually attacks with f3/Be3/Qd2 and a kingside pawn storm, or Bc4 pressure — meet wing attacks with the central ...d5 counterstrike.","moves":[{"u":"e2e4","san":"e4","c":"White pushes the e-pawn two squares, claiming space in the center right away."},{"u":"c7c5","san":"c5","c":"The Sicilian. Black does not copy White — instead a flank pawn (a pawn on the side of the board) fights for the d4 square, making the game unbalanced from move one.","k":["d4"]},{"u":"g1f3","san":"Nf3","c":"White develops the knight (brings it off the back rank) and prepares the d4 pawn break — heading for the Open Sicilian."},{"u":"b8c6","san":"Nc6","c":"Black develops the knight to its most natural square, where it watches both d4 and e5.","k":["d4","e5"]},{"u":"d2d4","san":"d4","c":"The Open Sicilian: White breaks open the center. This is the most challenging way to meet the Sicilian."},{"u":"c5d4","san":"cxd4","c":"Black trades a flank pawn for White's center pawn — a small long-term profit — and also gains the half-open c-file (no Black pawn left on it) for future counterplay.","k":["c2"]},{"u":"f3d4","san":"Nxd4","c":"White takes back with the knight, which lands on a powerful central square."},{"u":"g8f6","san":"Nf6","c":"Black develops the knight and attacks e4 in the same move — with tempo, so White must stop and defend the pawn.","a":["f6e4"]},{"u":"b1c3","san":"Nc3","c":"White guards e4 while developing another piece — the most natural answer."},{"u":"d7d6","san":"d6","c":"This completes the Classical setup: e5 is controlled, the c8-bishop's diagonal is open, and Black has not committed to a plan yet — ...e6, ...g6, or ...e5 are all still possible. Staying flexible is a real strength."}]},{"name":"Alapin (2.c3) — White's view","intro":"Tired of facing twenty Sicilian systems? The Alapin cuts through: White simply prepares d4 and builds the center with pawns. Black's sharpest weapons don't work here — the game becomes positional, on White's terms.","plan":"White typically gets pawns on d4 and e5 with free development — a space advantage that cramps Black all game. The plans: develop with Bc4 or Be2, castle, and use the extra space to maneuver (Re1, Bf4/Bg5, Nbd2). Black will chip with ...d6 and pressure d4; hold the center calmly with Be3/Nbd2 rather than grabbing more space. If the center pawns get traded, aim for active piece play against Black's isolated d-pawn positions.","moves":[{"u":"e2e4","san":"e4","c":"White plants a pawn in the center, gaining space and opening lines for the queen and the f1-bishop."},{"u":"c7c5","san":"c5","c":"The Sicilian: instead of copying White, Black fights for the d4 square with a flank pawn (a pawn on the side of the board), unbalancing the game."},{"u":"c2c3","san":"c3","c":"The Alapin plan: this pawn will support d4, so if Black trades (d4 cxd4, cxd4), White keeps a full pawn center. The cost: c3 was the b1-knight's best square, and Black will try to use exactly that.","k":["d4"]},{"u":"g8f6","san":"Nf6","c":"Black's best reply: attack e4 at once. White cannot defend with Nc3 — the pawn just took that square — so White must push the e-pawn forward, and Black plans to chip away at it.","a":["f6e4"]},{"u":"e4e5","san":"e5","c":"White pushes the pawn, gaining space and kicking the knight away — the only good way to defend it.","a":["e5f6"]},{"u":"f6d5","san":"Nd5","c":"The knight lands on a lovely square: d5. White's pawns cannot chase it away, because c4 would weaken the d4 square forever. Black's whole setup is built around this knight.","k":["d5"]},{"u":"d2d4","san":"d4","c":"White builds the big pawn center this opening aims for."},{"u":"c5d4","san":"cxd4","c":"Black trades pawns right away, before White finishes setting everything up."},{"u":"g1f3","san":"Nf3","c":"A clever move-order trick: White develops first and will take back on d4 with the c-pawn next, keeping the d4-plus-e5 pawn pair intact. Grabbing cxd4 immediately would invite an early ...d6 strike from Black.","k":["d4"]},{"u":"b8c6","san":"Nc6","c":"Black develops the knight, putting pressure on both d4 and e5.","a":["c6d4"]},{"u":"c3d4","san":"cxd4","c":"White takes back and gets the dream structure: pawns on d4 and e5, giving space and attacking chances. This pawn duo is the whole point of the Alapin.","k":["d4","e5"]},{"u":"d7d6","san":"d6","c":"Black hits back at the center right away — the correct plan. A big pawn center must be challenged before it becomes overwhelming. A fair, instructive middlegame lies ahead.","a":["d6e5"]}]}]},{"name":"Queen's Gambit","side":"w","icon":"♕","desc":"White's classical 1.d4 weapon: offer the c-pawn to deflect Black's d-pawn and dominate the center.","lines":[{"name":"QGD Main Line","intro":"The Queen's Gambit Declined is chess's aristocrat — over a century of world championship pedigree. Black calmly protects d5 and accepts a slightly cramped but extraordinarily solid position. White gets enduring pressure; Black waits for the right moment to free the position.","plan":"White's two classic plans: (1) the minority attack — b4–b5 creating a weak Black queenside pawn to besiege all game, or (2) central play with Qc2, Rd1 and a timely e4. Black's freedom plan is always the same: trade pieces (a cramped position loves trades), then break with ...c5 or ...e5 at the right moment. The c8-bishop is Black's problem child — getting it to f5 or g4 (often after ...dxc4 and ...b5) means Black has equalized.","moves":[{"u":"d2d4","san":"d4","c":"White plants a pawn in the center — and unlike 1.e4, this pawn is already guarded by the queen. Expect a slower game: 1.d4 openings win with structure and squeezing rather than quick attacks.","k":["d4"]},{"u":"d7d5","san":"d5","c":"Black plants a pawn on d5 too, taking an equal share of the center and stopping White's d-pawn from advancing."},{"u":"c2c4","san":"c4","c":"The Queen's Gambit — but it isn't a real sacrifice: if Black takes on c4, White regains the pawn easily. The real idea is to attack d5 from the side, hoping to remove it and rule the center, or force Black into passive defense.","a":["c4d5"],"k":["d5"]},{"u":"e7e6","san":"e6","c":"Black declines the gambit: the e6-pawn keeps d5 firmly protected. The price is small but real — the c8-bishop is now shut in behind its own pawns, and Black will spend the next ten moves trying to set it free. That bishop is the story of this whole opening.","k":["c8"]},{"u":"b1c3","san":"Nc3","c":"White develops (brings a piece into play) the knight, adding a second attacker to the d5-pawn.","a":["c3d5"]},{"u":"g8f6","san":"Nf6","c":"Black develops the knight and defends d5 at the same time. Both sides keep fighting over that one square, move for move."},{"u":"c1g5","san":"Bg5","c":"White pins the f6-knight — it can't move without exposing the queen behind it. Since that knight is d5's key defender, tying it down pressures d5 indirectly: a classic lesson in attacking a strong point through its defenders.","a":["g5f6"],"k":["d5"]},{"u":"f8e7","san":"Be7","c":"Black tucks the bishop on e7, breaking the pin so the knight is free again. No weaknesses, no drama — calm, solid play is the QGD's whole style."},{"u":"e2e3","san":"e3","c":"A quiet pawn move that supports d4 and opens the f1-bishop's diagonal. Notice White's restraint: no early adventures — the position stays compact and solid.","k":["d4"]},{"u":"e8g8","san":"O-O","c":"Black castles, tucking the king safely into the corner before the real fight begins."},{"u":"g1f3","san":"Nf3","c":"White develops the kingside knight. Bd3, castling and Rc1 come next — then White chooses a plan: the minority attack (pushing the queenside pawns to create weaknesses) or expanding in the center."},{"u":"b8d7","san":"Nbd7","c":"The knight settles on d7, reaching the classic QGD position. It supports both freeing pawn breaks, ...c5 and ...e5, and can later reroute via b6 or f8. Black is cramped but rock-solid — Capablanca won countless games from here with both colors."}]},{"name":"Queen's Gambit Accepted","intro":"Black takes the pawn — not to keep it, but to trade central tension for quick, free development. Black gives back the pawn at the right moment and strikes at d4 with ...c5, aiming for full equality in an open game.","plan":"White gets the freer game and a central majority; the question is whether it becomes an attack or a target. White's ideal: build with Qe2, Rd1, e4 and roll the center forward. Black's standard equalizing sequence: ...c5xd4 creating an isolated queen's pawn (IQP) for White, then blockade d5 with knights and trade pieces — an IQP grows weaker with every exchange. As White, attack before the simplification: Bd3, Qe2, and watch for Bxh7+ Greek-gift sacrifices when Black castles early.","moves":[{"u":"d2d4","san":"d4","c":"White stakes a claim in the center and opens lines for the queen and the c1-bishop."},{"u":"d7d5","san":"d5","c":"Black answers in the center, claiming an equal share of the space."},{"u":"c2c4","san":"c4","c":"The Queen's Gambit offer: White attacks d5 from the side, aiming to win control of the center.","a":["c4d5"]},{"u":"d5c4","san":"dxc4","c":"Black accepts and gives up the center — for now. The plan is not to keep the extra pawn (tries like ...b5 lose far too much time) but to develop (bring pieces into play) quickly while White spends a move taking the pawn back.","k":["c4"]},{"u":"g1f3","san":"Nf3","c":"White develops the knight and, just as importantly, prevents ...e5, which would free Black's game in one move. Stopping your opponent's best move is worth as much as making your own.","k":["e5"]},{"u":"g8f6","san":"Nf6","c":"Black develops the knight to its natural square, which also keeps control of e4."},{"u":"e2e3","san":"e3","c":"White opens the f1-bishop's diagonal, ready to capture on c4 and win the gambit pawn back."},{"u":"e7e6","san":"e6","c":"Black mirrors with ...e6, preparing the key strike ...c5. Yes, this shuts in the c8-bishop for now, just as in the QGD — but ...a6, ...b5 and ...Bb7 will free it later."},{"u":"f1c4","san":"Bxc4","c":"White wins the pawn back while developing a piece — the gambit's books always balance. The bishop lands actively on the a2–g8 diagonal, eyeing Black's kingside.","a":["c4e6"],"k":["e6"]},{"u":"c7c5","san":"c5","c":"The thematic counter-punch at d4. Black must challenge the center now, before White settles in with Qe2 and Rd1 — without this break, Black would slowly run out of space and suffocate.","a":["c5d4"],"k":["d4"]},{"u":"e1g1","san":"O-O","c":"White castles while keeping a small edge: better development and an extra pawn in the center. The middlegame question: will the d4-pawn become a strong passed pawn (one no enemy pawn can stop) or a long-term weakness?"},{"u":"a7a6","san":"a6","c":"A small pawn move with a big plan: ...b5 and ...Bb7 will finally activate the problem bishop on c8, gaining queenside space along the way. A rich, balanced middlegame lies ahead."}]},{"name":"Slav Defense Main Line","intro":"The Slav fixes the QGD's one flaw: by defending d5 with ...c6 instead of ...e6, the c8-bishop keeps its freedom and develops to f5 — actively placed before the pawn chain closes. Solid as granite, but with more dynamic potential than the QGD.","plan":"Black's setup completes with ...e6, ...Bb4 or ...Be7, and ...O-O — every piece on a sensible square, no weaknesses. White's space advantage is real but hard to convert: the standard plans are e4 (after Bg5/e3 preparation) or queenside pressure with Qb3. Black counters with ...e5 or ...c5 breaks once developed. The a4-pawn White played has a cost — the b4-square belongs to Black forever; a knight or bishop landing there is the Slav player's reward.","moves":[{"u":"d2d4","san":"d4","c":"White stakes a claim in the center and opens lines for the queen and the c1-bishop."},{"u":"d7d5","san":"d5","c":"Black answers in the center, claiming an equal share of the space."},{"u":"c2c4","san":"c4","c":"The Queen's Gambit offer: White attacks d5 from the side, aiming to win control of the center.","a":["c4d5"]},{"u":"c7c6","san":"c6","c":"The Slav's big idea: defend d5 with the c-pawn instead of ...e6, keeping the c8-bishop's diagonal open. Just as solid as the QGD, but the bishop stays free. The small cost: c6 was the b8-knight's best square, and now it's taken.","k":["c8"]},{"u":"g1f3","san":"Nf3","c":"White develops (brings out) the knight to its natural square, keeping watch on e5."},{"u":"g8f6","san":"Nf6","c":"Black develops the knight toward the center — simple, healthy opening play."},{"u":"b1c3","san":"Nc3","c":"The second knight joins in, adding pressure on d5. White's setup is exactly the same as against the QGD — every difference in this opening lives on Black's side of the board.","a":["c3d5"]},{"u":"d5c4","san":"dxc4","c":"Now Black takes the pawn — and the timing is the whole point. With ...c6 already played, Black genuinely threatens to keep it by supporting it with ...b5. White must spend a move to stop that, and the move has a price.","k":["b5"]},{"u":"a2a4","san":"a4","c":"White stops ...b5 and prepares to win back the c4-pawn. But note the cost: b4 is now a permanent hole in White's queenside (no White pawn can ever guard it), and Black's pieces will use it for the rest of the game. Every pawn move weakens something.","k":["b4"]},{"u":"c8f5","san":"Bf5","c":"The move the Slav was built for: the bishop reaches its dream square before ...e6 closes the diagonal. Compare it with its sad cousin stuck on c8 in the QGD. Black now develops smoothly: ...e6, ...Bb4 and castling come next.","k":["f5","b4"]}]}]},{"name":"London System","side":"w","icon":"♖","desc":"A sturdy, low-theory system: d4, Bf4, e3, and the same solid setup against almost anything.","lines":[{"name":"Main Line vs ...d5","intro":"The London is a system, not a sequence — the same sound setup (d4, Bf4, e3, Bd3, Nbd2, c3) against nearly anything Black does. Perfect when you'd rather understand one structure deeply than memorize twenty variations. The f4-bishop, developed OUTSIDE the pawn chain, is the system's soul.","plan":"The London pyramid (c3–d4–e3) is nearly impregnable. White's main plans: (1) the Ne5 outpost — plant the knight, support with f4 if needed, and attack f7/h7; (2) the slow kingside attack with Bd3, Ne5, Qf3–h3; (3) in the endgame, the queenside majority after dxc5. Black's counterplay comes down the c-file with ...Qb6 hitting b2 — know the response Qb3 (or Rb1). Don't rush: the London wins by improving pieces while Black runs out of useful moves.","moves":[{"u":"d2d4","san":"d4","c":"White pushes the queen's pawn two squares, grabbing space in the center. The pawn is already protected by the queen on d1, so it stands safely."},{"u":"d7d5","san":"d5","c":"Black copies the move, planting a pawn on d5 to claim an equal share of the center."},{"u":"c1f4","san":"Bf4","c":"The signature London move: bring the bishop out to f4 BEFORE playing e3, so it never gets locked behind its own pawns. Openings like the Queen's Gambit Declined show how sad a bishop stuck inside the pawn chain can be — White makes sure that never happens here.","k":["f4"]},{"u":"g8f6","san":"Nf6","c":"Black develops (brings out) the knight to f6, its most natural home."},{"u":"e2e3","san":"e3","c":"White starts building the famous pawn pyramid behind the bishop. With c3 coming soon, the c3-d4-e3 chain protects itself — a big reason the London needs so little memorizing.","k":["d4"]},{"u":"e7e6","san":"e6","c":"Black mirrors with ...e6 — solid, but it locks the c8-bishop behind its own pawns. Black accepts the exact bad-bishop problem White just avoided."},{"u":"g1f3","san":"Nf3","c":"White develops the knight and takes control of e5 — the key square the whole London middlegame revolves around.","k":["e5"]},{"u":"f8d6","san":"Bd6","c":"Black offers a bishop trade with ...Bd6. The f4-bishop is White's best piece, so swapping it off would be good business for Black."},{"u":"f4g3","san":"Bg3","c":"White dodges the trade. If Black ever captures on g3, White takes back with the h-pawn, opening the h-file for the rook — a free attacking road. Black usually regrets that trade, and meanwhile the bishop stays active on the b8-h2 diagonal.","k":["g3","h2"]},{"u":"e8g8","san":"O-O","c":"Black castles, tucking the king safely into the corner before the middlegame fight begins."},{"u":"f1d3","san":"Bd3","c":"The bishop takes the diagonal aiming straight at h7, right beside Black's king. Combined with a knight landing on e5 later, this can create real checkmate threats — the London is quiet, but not toothless.","a":["d3h7"],"k":["h7"]},{"u":"c7c5","san":"c5","c":"Black's correct counterplay: strike at d4 and open the c-file. Expect ...Qb6 next, aiming at the b2-pawn the bishop left unguarded when it went to f4 — the London's one tender spot.","a":["c5d4"],"k":["b2"]},{"u":"c2c3","san":"c3","c":"White completes the pawn pyramid. The d4-pawn is now defended three times, so Black's pressure on the center just bounces off.","k":["d4"]},{"u":"b8c6","san":"Nc6","c":"A standard London middlegame is reached. White's plan: castle, bring the other knight to d2, and aim to plant a knight on the strong e5 square. Solid for White, flexible for Black — see the strategy notes."}]},{"name":"vs King's Indian Setup","intro":"Against the fianchetto, the London keeps its shape but shifts its concern: Black's g7-bishop bears down on d4, and the ...e5 break is coming. White's setup stays solid, controls e5 by piece-count, and relies on h3 to preserve the key dark-squared bishop.","plan":"Black wants ...Nbd7 and ...e5 — you usually can't prevent it forever, so prepare to meet it well: keep d4 firmly guarded (c3, Nbd2), and when ...e5 comes, choose between dxe5 (then occupy the d-file and c4/e4 squares) or letting the tension stand. The h3–Bh2 resource keeps your best piece alive. Long-term: queenside space with c4 and b4 is White's healthiest plan, since Black owns the kingside dark squares. Respect the g7-bishop — never open the long diagonal carelessly.","moves":[{"u":"d2d4","san":"d4","c":"White pushes the queen's pawn two squares, claiming the center and opening lines for the queen and the dark-squared bishop."},{"u":"g8f6","san":"Nf6","c":"Black develops the knight first and stays flexible — a hint at an Indian setup, where Black holds back the center pawns for now."},{"u":"c1f4","san":"Bf4","c":"White plays the London bishop move anyway. That is the system's promise: one trusty setup against nearly everything Black tries.","k":["f4"]},{"u":"g7g6","san":"g6","c":"Black announces the King's Indian plan: fianchetto the bishop (develop it to g7, onto the long a1-h8 diagonal), castle, then strike back with ...e5 or ...c5. Unlike ...d5 setups, the center stays fluid here."},{"u":"e2e3","san":"e3","c":"The usual London structure: the e3-pawn supports d4 from behind the bishop, which is already safely outside the pawn chain."},{"u":"f8g7","san":"Bg7","c":"Black's bishop lands on the long diagonal, staring at d4 and, further behind it, the b2-pawn. This bishop is the heart of every Black plan — always keep track of what it can see.","a":["g7d4"],"k":["d4","b2"]},{"u":"g1f3","san":"Nf3","c":"White develops the knight, adding a defender to d4 and covering e5 — the very square Black most wants to claim.","k":["e5","d4"]},{"u":"e8g8","san":"O-O","c":"Black castles quickly, completing the standard King's Indian sequence: knight out, bishop fianchettoed, king safe."},{"u":"f1e2","san":"Be2","c":"A modest square, chosen on purpose. On d3 the bishop would block White's own queen from defending d4, and Black's ...Nh5 tricks would grow stronger. From e2 everything stays coordinated — sometimes the humble square is the right one.","k":["d4"]},{"u":"d7d6","san":"d6","c":"Black prepares the trademark plan: ...Nbd7 next, then the ...e5 break (a pawn strike at White's center). This is the King's Indian's core idea against every White setup."},{"u":"h2h3","san":"h3","c":"A little pawn move with a big job: if Black plays ...Nh5 to hunt the bishop, it can now slip back to h2 and stay on its key diagonal. Saving your best piece is worth a tempo (one move of time). White castles next and meets ...e5 with confidence.","k":["h2","g4"]}]}]},{"name":"French Defense","side":"b","icon":"♛","desc":"Solid and counterattacking: Black lets White build a center, then strikes it with ...c5 and ...f6.","lines":[{"name":"Advance Variation","intro":"When White locks the center with e5, the position becomes a textbook pawn-chain battle: White owns the kingside, Black owns the queenside, and the whole game revolves around the base of White's chain — d4. Black's plan is beautifully clear: pile everything onto that square.","plan":"Black's pressure scheme is a machine: ...Qb6, ...Nh6–f5 (yes, via the rim!), ...cxd4 and sometimes ...f6 to attack the chain's head too. White must defend d4 with everything and seek kingside space. Two big ideas to remember: Black often delays or even skips castling (the locked center makes the king safe in the middle), and the 'bad' c8-bishop seeks life via ...Bd7–b5, trading itself for White's good pieces. If d4 falls, Black wins the strategic battle outright.","moves":[{"u":"e2e4","san":"e4","c":"White pushes the king's pawn two squares, claiming the center — the most valuable ground on the board."},{"u":"e7e6","san":"e6","c":"This is the French Defense. Black prepares ...d5 next move with full pawn support. The cost: this pawn blocks Black's own c8-bishop — the famous 'French bishop' problem — but in return Black gets a rock-solid pawn pair and plenty of counterattacking chances.","k":["d5","c8"]},{"u":"d2d4","san":"d4","c":"White adds a second pawn to the center — a dream setup. But it is only temporary: Black is about to start hitting back at it."},{"u":"d7d5","san":"d5","c":"Black hits back at once, attacking the e4-pawn. White must now choose a path: push (e5), trade (exd5), or defend (Nc3 or Nd2) — and each choice leads to a very different kind of game.","a":["d5e4"]},{"u":"e4e5","san":"e5","c":"The Advance Variation: White pushes past, grabbing kingside space and locking the pawns in place. The d4–e5 pawn chain points at the kingside — that is where White will attack. But every pawn chain has a base...","k":["d4","e5"]},{"u":"c7c5","san":"c5","c":"...and Black attacks that base immediately. This is THE lesson of the French: strike a pawn chain at its base (here d4), not its head. Almost everything Black plays for the next ten moves will serve that one square.","a":["c5d4"],"k":["d4"]},{"u":"c2c3","san":"c3","c":"White supports the d4-pawn with another pawn, keeping the base of the chain solid."},{"u":"b8c6","san":"Nc6","c":"The knight develops (comes off the back rank) and becomes the second attacker on d4. Notice Black's plan: aim every new piece at the same weak point and pile up the pressure.","a":["c6d4"]},{"u":"g1f3","san":"Nf3","c":"White develops the knight and gives d4 a second defender — one move doing two jobs at once: bringing a piece out and guarding the key square."},{"u":"d8b6","san":"Qb6","c":"The queen is the third attacker on d4 — and she also eyes the b2-pawn, so White's c1-bishop must stay home to guard it. This is the classic Advance French setup: the siege of d4 is complete. Next Black adds one more attacker with ...Nh6-f5, or ...cxd4 first and then ...Nge7-f5.","a":["b6d4","b6b2"],"k":["d4","b2"]}]},{"name":"Exchange Variation","intro":"White trades on d5 and the French's famous tension evaporates: symmetrical pawns, open lines, free development for both sides. Black's 'bad bishop' problem is solved instantly. Often chosen hoping for a quiet draw — but symmetry rewards whoever plays with more purpose.","plan":"Don't let symmetry lull you to sleep — it breaks the moment someone gains a tempo. The e-file is the whole game early on: both sides race rooks to e1/e8. Black equalizes comfortably with natural moves (...Bd6, ...O-O, ...Bg4, ...Nc6 or ...c6 with ...Re8), then plays for more: ideas include ...Ne4, ...Qf6 pointing at the kingside, or a minority-style ...b5–b4 if White commits to c3. The first player to run out of useful moves loses the symmetry battle.","moves":[{"u":"e2e4","san":"e4","c":"White pushes the king's pawn two squares, claiming the center — the most valuable groun
