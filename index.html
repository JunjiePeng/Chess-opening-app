d on the board."},{"u":"e7e6","san":"e6","c":"The French Defense: a solid, counterattacking setup. Black prepares to push ...d5 next move with this pawn backing it up."},{"u":"d2d4","san":"d4","c":"White sets up two pawns side by side in the center. It looks strong now — but later those big pawns can become targets."},{"u":"d7d5","san":"d5","c":"Black strikes back at once, attacking White's e4-pawn. This supported ...d5 push is the whole point of the French Defense.","a":["d5e4"]},{"u":"e4d5","san":"exd5","c":"The Exchange Variation: White trades pawns right away, releasing the central tension (pawns that could capture each other). It is harmless for Black, but it teaches one lesson: once the tension is gone, piece activity decides everything.","k":["d5"]},{"u":"e6d5","san":"exd5","c":"Black takes back — and just like that, the c8-bishop, normally Black's problem piece in the French, is free to come out. Black has no structural worries at all; the only question left is who will use the open lines better.","k":["c8"]},{"u":"g1f3","san":"Nf3","c":"White develops (brings out) the knight and heads for a quick castle — tucking the king safely away in the corner."},{"u":"g8f6","san":"Nf6","c":"Black develops the knight to its best square, controlling e4. In symmetrical positions like this the rule is simple: develop toward the center and try to claim the open file first."},{"u":"f1d3","san":"Bd3","c":"White's bishop takes its best diagonal, pointing toward Black's kingside."},{"u":"f8d6","san":"Bd6","c":"Black mirrors the idea: on d6 the bishop guards e5 and can support Black's own kingside plans later. Copying is fine here — White is the one who must prove an advantage, and in this level position there is little to prove.","k":["e5"]},{"u":"e1g1","san":"O-O","c":"White castles, finishing the first duty of every opening: get the king to safety."},{"u":"e8g8","san":"O-O","c":"Black castles too, and the position is fully equal. Now the real contest begins: bring the rooks to the open e-file, then play ...Bg4 or ...Nc6. In this 'drawish' position, whoever finds the more active squares comes out on top — see the strategy notes."}]},{"name":"Tarrasch Variation","intro":"White's Nd2 defends e4 while dodging the annoying ...Bb4 pin — at the cost of blocking the c1-bishop. Black's sharpest answer is an immediate ...c5, accepting an isolated d-pawn in return for free, active piece play. A classic structure-versus-activity bargain.","plan":"Black's game plan flows from the isolated d5-pawn: use the piece activity it provides BEFORE it becomes an endgame weakness. Develop fast (...Nc6, ...Bd6, ...Nge7 or ...Nf6, ...O-O), occupy e4 with a knight, and generate kingside threats — the IQP grants the e4 and c4 squares as outposts. Avoid piece trades (each one magnifies the pawn's weakness) and never drift into a pure endgame. If White blockades d4 and trades pieces, sit tight: the d-pawn is defensible, and ...d4 breaks can liquidate it at the right moment.","moves":[{"u":"e2e4","san":"e4","c":"White pushes the king's pawn two squares, claiming the center — the most valuable ground on the board."},{"u":"e7e6","san":"e6","c":"The French Defense: a solid, counterattacking setup. Black prepares to push ...d5 next move with this pawn backing it up."},{"u":"d2d4","san":"d4","c":"White sets up two pawns side by side in the center. It looks strong now — but later those big pawns can become targets."},{"u":"d7d5","san":"d5","c":"Black strikes back at once, attacking White's e4-pawn. This supported ...d5 push is the whole point of the French Defense.","a":["d5e4"]},{"u":"b1d2","san":"Nd2","c":"The Tarrasch Variation: the knight defends e4 while keeping the c3-square free for a pawn. Unlike Nc3, a later ...Bb4 pin has no sting here — White simply plays c3 and chases the bishop away. The cost: this knight blocks its own c1-bishop. Every square choice is a trade-off.","k":["e4","c3"]},{"u":"c7c5","san":"c5","c":"Black's most ambitious reply: strike the center right now, while the d2-knight stands awkwardly. Black is happy to accept an isolated pawn (a pawn with no friendly pawns beside it) in exchange for the freest, most active piece play the French ever offers.","a":["c5d4"],"k":["d4"]},{"u":"e4d5","san":"exd5","c":"White trades pawns in the center on purpose — the point is to leave Black with an isolated d-pawn."},{"u":"e6d5","san":"exd5","c":"Black takes back. The d5-pawn is headed for isolation: once the c- and d-pawns are traded off, it will have no friendly pawns beside it. That means endgame weakness, but open lines and the e4 and c4 squares in return. Black chose this on purpose: activity now, pay the bill later.","k":["d5","e4","c4"]},{"u":"g1f3","san":"Ngf3","c":"White develops the other knight. It guards the d4-pawn now, and later a piece will land on d4 itself — the square in front of Black's coming isolated pawn. The standard plan against one: first blockade it (park a piece in front so it cannot advance), then gang up on it.","k":["d4"]},{"u":"b8c6","san":"Nc6","c":"Black develops the knight to its most active square and fights back for control of d4."},{"u":"f1b5","san":"Bb5","c":"White's bishop pins the c6-knight: it cannot move, or the black king behind it on the diagonal would be exposed. White plans to castle next and keep tightening the grip on d4."},{"u":"f8d6","san":"Bd6","c":"Black develops the bishop actively, aiming at White's kingside. This is the isolated pawn's gift: Black's pieces all flow to natural, active squares. Next come ...Nge7 and ...O-O, with quick piece play before White's blockade of d4 settles in. See the strategy notes for the full plan.","k":["e4"]}]}]},{"name":"Caro-Kann Defense","side":"b","icon":"♜","desc":"Solid like the French, but the light-squared bishop gets out before ...e6. A favorite for beginners and world champions alike.","lines":[{"name":"Classical Variation","intro":"The Caro-Kann's main line showcases its whole philosophy: build the same solid ...d5 structure as the French, but develop the light-squared bishop FIRST. Black gets a position with no weaknesses and a clear piece plan — at the cost of a small concession in space.","plan":"Black's development scheme is almost automatic: ...e6, ...Ngf6 (or ...Bd6), ...O-O (or sometimes ...Qc7 and ...O-O-O), and the central break ...c5 at the right moment — the same base-strike idea as the French, but with the good bishop already traded or tucked safely on h7. White's space means Black shouldn't rush: trade a pair of minor pieces, keep the structure intact, and the endgame will smile on you — Caro-Kann endgames are famously pleasant. Watch White's h-pawn advance: it gained kingside space, which becomes a target for a later ...g5 or endgame counterplay.","moves":[{"u":"e2e4","san":"e4","c":"White pushes the king's pawn two squares, grabbing central space and opening lines for the queen and bishop."},{"u":"c7c6","san":"c6","c":"The Caro-Kann: this pawn prepares ...d5 to challenge the center while keeping the c8–h3 diagonal open, so the light-squared bishop can get out. The French plays ...e6 with the same plan but buries that bishop. The cost: c6 takes the knight's best square, and Black spends a little time.","k":["d5","c8"]},{"u":"d2d4","san":"d4","c":"White sets up the full two-pawn center. It looks strong — and it is — but Black's whole opening is built to challenge it at once."},{"u":"d7d5","san":"d5","c":"Black strikes at White's e4 pawn, and the c6 pawn is already there to support d5 — exactly what Black's first move prepared.","a":["d5e4"]},{"u":"b1c3","san":"Nc3","c":"White defends the e4 pawn by developing a knight (bringing a piece off the back rank). Defending with a piece instead of a pawn keeps every option open for White."},{"u":"d5e4","san":"dxe4","c":"Black captures on e4 at just the right moment — before White can push e5 on better terms. Trading the d-pawn for White's e-pawn gives up a little space, but leaves Black a compact structure with no weaknesses at all — solidity that lasts deep into the endgame."},{"u":"c3e4","san":"Nxe4","c":"White takes back with the knight, which lands on a beautiful central square — though it won't be allowed to stay there for long."},{"u":"c8f5","san":"Bf5","c":"The Caro-Kann's signature move. The bishop develops to its best diagonal and hits the e4 knight with tempo (White must stop and react). Getting this bishop out before ...e6 can lock it in is the whole reason 1...c6 exists.","a":["f5e4"],"k":["f5"]},{"u":"e4g3","san":"Ng3","c":"The knight saves itself by hopping to g3, attacking the f5 bishop on the way — White wins back the time just spent.","a":["g3f5"]},{"u":"f5g6","san":"Bg6","c":"The bishop steps back to its safe home. It looks passive on g6, but it still controls the whole b1–h7 diagonal — and after the coming trade on d3 or h7, Black will have no bad pieces at all."},{"u":"h2h4","san":"h4","c":"An aggressive thrust: White threatens h5, trapping the g6 bishop! Black must make an escape hatch immediately. White gains space, but this far-advanced h-pawn may become weak later — a real investment, not a free move.","a":["h4h5"],"k":["h5"]},{"u":"h7h6","san":"h6","c":"The essential reply — never, ever skip it. This little pawn move gives the bishop an escape square on h7 and stops White's h5–h6 ideas. Forget it, and h5 traps the bishop and wins a piece. Drill this move into memory.","k":["h7"]},{"u":"g1f3","san":"Nf3","c":"White keeps developing pieces, aiming to castle quickly and tuck the king away safely."},{"u":"b8d7","san":"Nd7","c":"A careful move order: this knight comes out first so Black can play ...Ngf6 next — then if White trades with Nxf6+, Black recaptures with the other knight and keeps the pawn structure perfect. Structure first: that's the Caro-Kann creed. Development continues with ...e6, ...Bd6 and castling."}]},{"name":"Advance Variation","intro":"Against the space-grabbing e5, the Caro-Kann shows its superiority over the French in one move: ...Bf5, developing the bishop OUTSIDE the chain before ...e6. Black gets the French's solid structure with none of its bad-bishop sorrow.","plan":"Black has two healthy plans, often combined: the ...c5 base-strike (the French recipe, but more comfortable here), and piece pressure with ...Ne7–f5 plus ...Nd7 against d4. The thematic maneuver ...Ne7–g6 (or ...f5!?) also fights for the e5/f4 squares. White's extra space wants a kingside expansion (g4!? chasing your bishop) — meet flank aggression with the central ...c5 break, the universal answer. Endgames favor Black's healthier structure; trade into them happily.","moves":[{"u":"e2e4","san":"e4","c":"White pushes the king's pawn two squares, grabbing central space and opening lines for the queen and bishop."},{"u":"c7c6","san":"c6","c":"The Caro-Kann: Black prepares the central strike ...d5 while keeping the diagonal clear, so the c8 bishop can develop (come off the back rank) freely later."},{"u":"d2d4","san":"d4","c":"White builds the big two-pawn center. It looks imposing now, but those advanced pawns can turn into targets for Black later on."},{"u":"d7d5","san":"d5","c":"Black hits e4 immediately. This supported pawn strike is the whole point of the opening — c6 was played to make ...d5 possible.","a":["d5e4"]},{"u":"e4e5","san":"e5","c":"The Advance Variation: White pushes past and locks the center, forming the same d4–e5 pawn chain as the French Advance. Now watch Black's next move — the one French players never get to play.","k":["d4","e5"]},{"u":"c8f5","san":"Bf5","c":"The move the whole Caro-Kann exists for: the bishop escapes to its perfect diagonal before ...e6 can shut the door on it. Black gets the French Defense's famous solidity — without its one sorrow, the buried light-squared bishop.","k":["f5"]},{"u":"g1f3","san":"Nf3","c":"White develops sensibly. Note that White can also try the aggressive g4 or h4 to hunt your bishop — stay calm, reply with ...e6 or ...h5, and the bishop will always find safety on g6 or h7."},{"u":"e7e6","san":"e6","c":"Only now does Black close the pawn chain — the bishop is already safely outside it. The result is the French Advance structure with a perfect light-squared bishop: strictly the better version.","k":["d5","e6"]},{"u":"f1e2","san":"Be2","c":"White develops the bishop quietly to e2, clearing the way to castle."},{"u":"b8d7","san":"Nd7","c":"Flexible development: from d7 the knight supports the coming ...c5 break, striking at d4 — the base of White's pawn chain. The other knight will go to e7, heading for f5 or g6."},{"u":"e1g1","san":"O-O","c":"White castles, tucking the king safely away — the first duty of every opening, complete."},{"u":"g8e7","san":"Ne7","c":"The signature Caro-Kann knight route: from e7 this knight can jump to f5 to attack d4, or to g6 to attack e5 and f4. The plan from here is clear — ...c5, then ...Be7 or ...Nb6, and Black can castle on either side. The position almost plays itself; see the strategy notes.","k":["f5","g6"]}]},{"name":"Exchange Variation","intro":"White trades on d5 hoping for an easy, symmetric game — but unlike the French Exchange, there's a real fight here: White takes the d3-square first with the bishop, trying to deny Black's c8-bishop its dream development. Black equalizes with precise, natural moves.","plan":"This is the 'Carlsbad' structure (mirrored): expect White to try the minority-attack idea in reverse or simple piece play. Black's plan: complete development (...e6, ...Bd6 or ...Be7, ...O-O), place the rooks on c8/e8, and use the half-open c-file — ...Qb6 and ...Rc8 pressure b2/c3. The g4-bishop pin on f3 is Black's active resource; retreating it to h5/g6 keeps long-term pressure. Endgames are level or better for Black: the structure is symmetric and weakness-free. Just don't fall for early Qb3 tricks against b7 — ...Qd7 or ...Qc8 holds everything.","moves":[{"u":"e2e4","san":"e4","c":"White pushes the king's pawn two squares, grabbing central space and opening lines for the queen and bishop."},{"u":"c7c6","san":"c6","c":"The Caro-Kann: Black prepares the central strike ...d5 while keeping the diagonal clear, so the c8 bishop can develop (come off the back rank) freely later."},{"u":"d2d4","san":"d4","c":"White builds the big two-pawn center. It looks imposing now, but those advanced pawns can turn into targets for Black later on."},{"u":"d7d5","san":"d5","c":"Black hits e4 immediately. This supported pawn strike is the whole point of the opening — c6 was played to make ...d5 possible.","a":["d5e4"]},{"u":"e4d5","san":"exd5","c":"The Exchange Variation: White trades pawns right away, sidestepping heavy theory and aiming for a small, clean edge.","k":["d5"]},{"u":"c6d5","san":"cxd5","c":"Black recaptures with the c-pawn — the only pawn that can take, and happily a good one: Black keeps a healthy, solid structure, and the half-open c-file gives Black's rooks a future highway.","k":["c6"]},{"u":"f1d3","san":"Bd3","c":"The point of White's move order: the bishop occupies the b1–h7 diagonal first, denying Black's bishop the f5 square it lives for. A small battle over one diagonal — and small battles like this are exactly what decide openings.","a":["d3f5"],"k":["f5"]},{"u":"b8c6","san":"Nc6","c":"Black develops the knight actively, adding pressure against White's d4 pawn."},{"u":"c2c3","san":"c3","c":"White shores up the d4 pawn and opens the queen's path to b3. A warning: with Black's c8 bishop leaving home, the b7 pawn loses its guard — watch for queen tricks against it.","k":["b7"]},{"u":"g8f6","san":"Nf6","c":"Black develops the kingside knight to its most natural square, keeping an eye on the central e4 square."},{"u":"c1f4","san":"Bf4","c":"White develops the bishop to its favorite diagonal — a London System-style setup, though here the colors tell a different story."},{"u":"c8g4","san":"Bg4","c":"Denied f5, the bishop stays active: on g4 it eyes f3, so a knight landing there would be pinned against the queen. That adds to the pressure on d4, which always needs watching after ...e6. Black plays ...e6, ...Bd6 or ...Be7 and castles — fully equal. Middlegame plans are in the strategy notes.","a":["g4d1"],"k":["d4"]}]}]},{"name":"Scotch Game","nameZh":"苏格兰开局","side":"w","icon":"♘","desc":"Open the centre on move 3 with d4. Direct piece play, clear plans, and none of the slow manoeuvring of the Ruy Lopez.","descZh":"第 3 回合就用 d4 打开中心。子力出动直接、计划清晰，没有西班牙开局那种缓慢的调动。","lines":[{"name":"Classical (4...Bc5)","nameZh":"古典变例（4...Bc5）","intro":"The main line: Black develops the bishop actively and White builds a broad centre with c3.","introZh":"主变：黑方主教积极出动，白方用 c3 构筑宽阔中心。","plan":"Push f4 or play Nc3/Bc4 setups; your space in the centre gives long-term pressure. Watch the e4-pawn.","planZh":"可推 f4 或采用 Nc3/Bc4 布局；中心空间带来长期压力。留意 e4 兵。","moves":[{"u":"e2e4","san":"e4","c":"Push your king's pawn two squares to claim the centre. It also opens lines so your bishop and queen can come out.","cZh":"王前兵挺进两格，抢占中心，同时为象和后打开出路。"},{"u":"e7e5","san":"e5","c":"Black does the same, staking an equal claim in the centre so White can't have it all.","cZh":"黑方照样挺兵 e5，同样抢占中心，不让白方独占。"},{"u":"g1f3","san":"Nf3","c":"Develop your knight (bring it off the back rank) to f3 — and it arrives with a threat, attacking Black's e5 pawn.","cZh":"出马到 f3：出子同时攻击黑方 e5 兵，一手带威胁，黑方必须应对。"},{"u":"b8c6","san":"Nc6","c":"Black's knight comes to c6, developing a piece and defending the e5 pawn in one move — the most natural reply.","cZh":"黑马上 c6，既出子又保住 e5 兵，一举两得，是最自然的应法。"},{"u":"d2d4","san":"d4","c":"The signature Scotch move: a second pawn strikes the centre immediately, challenging e5 head-on.","cZh":"苏格兰开局的标志：d4 兵立即冲击中心，直接向 e5 发难。","a":["d4e5"]},{"u":"e5d4","san":"exd4","c":"Black really has to capture — trying to defend e5 yet again would just give up ground.","cZh":"黑方基本只能吃掉 d4 兵——继续死守 e5 会丢空间、局面吃亏。"},{"u":"f3d4","san":"Nxd4","c":"Take the pawn back with the knight, which now sits on a strong central square.","cZh":"白马吃回 d4 兵，稳稳占据中心好位置。"},{"u":"f8c5","san":"Bc5","c":"Black develops the bishop to c5 and attacks your d4 knight — a developing move with tempo (White must stop and deal with the threat).","cZh":"黑象出到 c5 攻击 d4 白马——出子还带威胁（白方必须停下来应对），赚了时间。","a":["c5d4"]},{"u":"c1e3","san":"Be3","c":"Defend the d4 knight with your bishop. White is happy to see exchanges on d4 — after the recaptures, White's pieces end up dominating the centre.","cZh":"白象上 e3 保护 d4 马。白方不怕在 d4 上换子——一番交换之后，白方子力将稳稳控制中心。"},{"u":"d8f6","san":"Qf6","c":"Black's queen joins in from f6, doubling the pressure on d4. Bringing the queen out this early is unusual, but here it has a clear target.","cZh":"黑后出到 f6，再度施压 d4。后出动虽早，但这里目标明确。"},{"u":"c2c3","san":"c3","c":"Now a pawn solidly defends the d4 knight, and White is ready to build a big pawn centre.","cZh":"c3 兵稳稳撑住 d4 马，还为将来扩张大兵中心做准备。","k":["d4"]},{"u":"g8e7","san":"Nge7","c":"Black's kingside knight develops via e7, heading for g6 or d5. This route keeps the f-pawn free and doesn't block the queen on f6.","cZh":"黑马从 g8 走 e7，准备转往 g6 或 d5。这条路线不挡 f 兵，也不挡 f6 上的后。"},{"u":"f1c4","san":"Bc4","c":"Develop the bishop to c4, aiming at f7 — Black's weakest square — and clearing the way to castle.","cZh":"白象出到 c4，瞄准黑方最薄弱的 f7 格，同时为王车易位让路。","a":["c4f7"]},{"u":"c6e5","san":"Ne5","c":"Black's knight leaps to e5 and hits your c4 bishop. It looks aggressive, but don't panic.","cZh":"黑马跳 e5 攻击 c4 白象。看着吓人，其实不必慌。"},{"u":"c4e2","san":"Be2","c":"Simply step the bishop back to e2. Black's e5 knight looks active, but no pawn can ever support it there, and White will chase it away later.","cZh":"白象从容退回 e2 即可。e5 黑马看似活跃，却得不到兵的支撑，日后会被白方驱赶。"},{"u":"f6g6","san":"Qg6","c":"Black's queen shifts to g6, eyeing both your e4 pawn and the g2 pawn near your king. White needs to play carefully now.","cZh":"黑后滑到 g6，同时盯上 e4 兵和白王旁边的 g2 兵，白方要走得精确。"},{"u":"e1g1","san":"O-O","c":"Castle — king safety first, and it hides a trap: if Black greedily plays Qxe4??, then Nb5 attacks c7 and wins material.","cZh":"王车易位保王安全——还暗藏陷阱：黑后若贪吃 e4 兵，白方 Nb5 攻 c7，可以赢子。","k":["e4"]}]},{"name":"Schmidt (4...Nf6)","nameZh":"施密特变例（4...Nf6）","intro":"Black counterattacks e4 instead of defending. White gains time on the queen with e5.","introZh":"黑方不防守而是反击 e4。白方用 e5 抢步调。","plan":"You get a space-gaining e5-pawn and quick queenside play with c4/b3. Black's doubled c-pawns are a long-term target.","planZh":"e5 兵带来空间，c4/b3 快速展开后翼。黑方的叠 c 兵是长期目标。","moves":[{"u":"e2e4","san":"e4","c":"Push the king's pawn two squares: take the centre and free your bishop and queen.","cZh":"王前兵进两格，控制中心，为象和后打开出路。"},{"u":"e7e5","san":"e5","c":"Black mirrors you, keeping the position symmetrical for now.","cZh":"黑方照走 e5，与白方平分中心，暂时保持对称。"},{"u":"g1f3","san":"Nf3","c":"Develop the knight (bring it off the back rank) and attack Black's e5 pawn at the same time.","cZh":"出马 f3，出子同时攻击 e5 兵，逼黑方表态。"},{"u":"b8c6","san":"Nc6","c":"Black brings a knight to c6, guarding the e5 pawn while developing.","cZh":"黑马上 c6，出子并保护 e5 兵。"},{"u":"d2d4","san":"d4","c":"The Scotch strike: a second pawn hits the centre at once.","cZh":"苏格兰突击：d4 再冲中心，立刻挑战 e5。"},{"u":"e5d4","san":"exd4","c":"Black captures — it's effectively forced, since clinging to the e5 pawn would leave Black worse off.","cZh":"黑方吃兵，实际上是必走——死守 e5 只会吃亏。"},{"u":"f3d4","san":"Nxd4","c":"Recapture with the knight and plant it in the middle of the board.","cZh":"白马吃回，占据强大的中心位置。"},{"u":"g8f6","san":"Nf6","c":"Instead of defending, Black develops the knight to f6 and counterattacks your e4 pawn.","cZh":"黑方不守兵，出马 f6 直接反击白方 e4 兵。","a":["f6e4"]},{"u":"d4c6","san":"Nxc6","c":"Before saving e4, trade knights on c6 — this damages Black's pawn structure first.","cZh":"先不忙救 e4，在 c6 换掉马，先破坏黑方的兵形。"},{"u":"b7c6","san":"bxc6","c":"Black takes back toward the centre with the b-pawn — but is left with doubled c-pawns (two pawns stacked on one file).","cZh":"黑方用 b 兵朝中心方向吃回——但 c 线出现叠兵（同一列上两个兵），兵形受损。","k":["c6","c7"]},{"u":"e4e5","san":"e5","c":"Push the pawn to e5, attacking the f6 knight and gaining time — Black must deal with this threat before doing anything else.","cZh":"e 兵推进到 e5，攻击 f6 马抢时间——黑方必须先应付这个威胁。","a":["e5f6"]},{"u":"d8e7","san":"Qe7","c":"The main move: Black's queen comes to e7, attacking and pinning your e5 pawn — your king sits behind it on the e-file.","cZh":"主流应法：黑后到 e7 攻击并牵制 e5 兵——e 线上正对白王，这个兵不敢乱动。"},{"u":"d1e2","san":"Qe2","c":"Defend the e5 pawn with your own queen and keep the pin under control. The queens now face each other on the e-file.","cZh":"白后上 e2 保护 e5 兵，化解牵制，双后在 e 线对峙。"},{"u":"f6d5","san":"Nd5","c":"The attacked knight hops to d5, a fine central post for it.","cZh":"被攻击的黑马跳到 d5，占据优良的中心据点。"},{"u":"c2c4","san":"c4","c":"Kick the knight with the c-pawn and gain space on the queenside at the same time.","cZh":"c4 兵驱赶黑马，同时夺取后翼空间。","a":["c4d5"]},{"u":"c8a6","san":"Ba6","c":"A known trick: Black's bishop goes to a6, pinning your c4 pawn against the queen on e2. Now cxd5 would lose your queen to Bxe2 — so the attacked knight is safe for the moment.","cZh":"常见手段：黑象出 a6 牵制 c4 兵——兵后正是 e2 白后，cxd5 吃马会因 Bxe2 丢后，d5 马暂时安然无恙。"},{"u":"b2b3","san":"b3","c":"Calmly defend c4 with the b-pawn. Your structure holds together, and the e5 pawn keeps Black's position cramped (short of space).","cZh":"冷静用 b3 兵保住 c4。白方结构稳固，e5 兵继续压得黑方施展不开。","k":["e5"]}]},{"name":"Scotch Gambit","nameZh":"苏格兰弃兵","intro":"Offer the d4-pawn for rapid development and attacking chances against f7.","introZh":"弃 d4 兵换取快速出子和对 f7 的攻击机会。","plan":"Develop every piece with a threat. If Black grabs material, open the centre and attack the king before it castles.","planZh":"每一步出子都带威胁。若黑方贪子，就在其易位前打开中心攻王。","moves":[{"u":"e2e4","san":"e4","c":"Centre first: the king's pawn advances two squares and opens lines for your pieces.","cZh":"先占中心，同时为子力打开线路。"},{"u":"e7e5","san":"e5","c":"The classical reply — Black meets you in the centre.","cZh":"黑方古典应法，同样争夺中心。"},{"u":"g1f3","san":"Nf3","c":"Develop the knight and attack the e5 pawn.","cZh":"出马 f3，攻击黑方 e5 兵。"},{"u":"b8c6","san":"Nc6","c":"Black defends e5 with the knight while developing a piece.","cZh":"黑马上 c6，出子同时保护 e5 兵。"},{"u":"d2d4","san":"d4","c":"Strike the centre — but this time White offers the d4 pawn as a gambit (giving up a pawn for faster development).","cZh":"d4 冲击中心——这次是弃兵（用一个兵换取更快的出子速度）。"},{"u":"e5d4","san":"exd4","c":"Black accepts the offer and takes the pawn.","cZh":"黑方接受弃兵，吃掉 d4。"},{"u":"f1c4","san":"Bc4","c":"The gambit point: skip recapturing on d4 and develop the bishop fast, aiming straight at f7 — Black's weakest square.","cZh":"弃兵精髓：不急着吃回 d4，先出象到 c4，直指黑方最薄弱的 f7 格。","a":["c4f7"]},{"u":"f8c5","san":"Bc5","c":"Black develops the bishop symmetrically to c5 — the safest choice.","cZh":"黑方对称出象到 c5——最稳妥的选择。"},{"u":"c2c3","san":"c3","c":"Attack Black's extra d4 pawn and try to rebuild a full pawn centre.","cZh":"c3 攻击黑方 d4 兵，试图重建完整的兵中心。"},{"u":"g8f6","san":"Nf6","c":"The critical test: Black develops the knight to f6 and counterattacks your e4 pawn.","cZh":"关键考验：黑方出马 f6，反击白方 e4 兵。"},{"u":"c3d4","san":"cxd4","c":"Take back on d4. Your pawn centre is now huge — but the e4 pawn is hanging (left undefended).","cZh":"吃回 d4。白方中心庞大，但 e4 兵暂时没人保护。"},{"u":"c5b4","san":"Bb4+","c":"Check! By forcing you to deal with the check first, Black gains the time needed to grab the e4 pawn.","cZh":"将军！黑方借将军抢时间，下一步就要吃掉 e4 兵。"},{"u":"b1c3","san":"Nc3","c":"Block the check with the knight — and since Black's bishop pins it, e4 still falls. In effect White offers a second pawn for speed.","cZh":"马垫将。但 c3 马被黑象牵制，e4 兵等于再弃一兵——用实惠换速度。"},{"u":"f6e4","san":"Nxe4","c":"Black takes the bait and grabs the e4 pawn.","cZh":"黑方吞下诱饵，吃掉 e4 兵。"},{"u":"e1g1","san":"O-O","c":"Castle — your king is safe. Black is threatening your c3 knight, but White's own threats against f7 are looming.","cZh":"王车易位保王安全。黑方虽威胁 c3 马，但白方对 f7 的攻势也在酝酿。"},{"u":"b4c3","san":"Bxc3","c":"Black captures on c3 and seems to win a whole piece... but only temporarily.","cZh":"黑象吃掉 c3 马，看似赢了一子……只是暂时的。"},{"u":"d4d5","san":"d5","c":"The famous zwischenzug (in-between move): instead of recapturing, d5 attacks the c6 knight and rips the centre open. White's lead in development is rich compensation.","cZh":"著名的中间着：不忙吃回，d5 挺进攻击 c6 马并打开中心。白方出子飞快，补偿丰厚。","a":["d5c6"]}]}]},{"name":"English Opening","nameZh":"英国式开局","side":"w","icon":"♙","desc":"Start with 1.c4 — control d5 from the side, often reaching a Sicilian with colours (and a tempo) reversed.","descZh":"以 1.c4 开局——从侧翼控制 d5，常形成多一步棋的“反向西西里”。","lines":[{"name":"Reversed Sicilian (1...e5)","nameZh":"反向西西里（1...e5）","intro":"Black occupies the centre; you play a Sicilian setup a full tempo up.","introZh":"黑方占中心；你以多一步的西西里布局应对。","plan":"Fianchetto, castle, then expand with b4-b5 or strike with d4. The g2-bishop rakes the long diagonal.","planZh":"上翼象、易位，然后 b4-b5 扩张或 d4 突破。g2 主教扫射长斜线。","moves":[{"u":"c2c4","san":"c4","c":"Push the c-pawn two squares to control the key d5 square from the side, while keeping your central d- and e-pawns flexible for later.","cZh":"c兵挺进两格，从侧翼控制关键的 d5 格，中心的 d兵和 e兵先不表态，保留灵活性。","k":["d5"]},{"u":"e7e5","san":"e5","c":"Black grabs the centre with the e-pawn. The game now looks like a Sicilian Defence with colours reversed — and you effectively have an extra move.","cZh":"黑方 e 兵占据中心。局面就像颜色对调的西西里防御，而你相当于多走了一步。"},{"u":"b1c3","san":"Nc3","c":"Develop the knight (bring it off the back rank) to c3, adding another piece that controls the d5 square.","cZh":"出马到 c3，再添一子加强对 d5 格的控制。"},{"u":"g8f6","san":"Nf6","c":"Black develops the knight to its natural square f6, where it watches the centre.","cZh":"黑方自然出子，马上 f6 盯住中心。"},{"u":"g1f3","san":"Nf3","c":"Develop the other knight. From f3 it pokes at Black's e5 pawn and helps prepare the central pawn push d4.","cZh":"另一只马出动到 f3，骚扰黑方 e5 兵，并为推 d4 做准备。"},{"u":"b8c6","san":"Nc6","c":"Black brings out the queenside knight to defend the e5 pawn.","cZh":"黑方出后翼马，保护 e5 兵。"},{"u":"g2g3","san":"g3","c":"The signature English move: g3 prepares a fianchetto (bishop on the long diagonal) — the bishop will sit on g2 and aim across the whole board.","cZh":"英国式开局的标志性一手：g3 准备侧翼出象（象上长斜线），象将落在 g2 遥控全局。"},{"u":"d7d5","san":"d5","c":"Black pushes d5 to free the position and challenge the centre. Don't worry — your setup expects and allows exactly this break.","cZh":"黑方推 d5 释放局面、争夺中心——别慌，这正是你的布局允许的突破。"},{"u":"c4d5","san":"cxd5","c":"Capture with the c-pawn. This trade steers the game into the pawn structure your setup wants.","cZh":"c 兵吃掉 d5 兵，把局面换成你想要的兵形结构。"},{"u":"f6d5","san":"Nxd5","c":"Black's knight takes back the pawn on d5.","cZh":"黑马吃回 d5 兵。"},{"u":"f1g2","san":"Bg2","c":"The bishop lands on g2, taking aim along the long diagonal. Your own knight on f3 blocks it for now, but the moment that knight moves, the bishop will hit the d5 knight — and later it can press b7 and even the corner square a8.","cZh":"象上 g2，瞄准长斜线。f3 马暂时挡路，可它一旦移开，象就直射 d5 马，之后还能施压 b7 甚至角上的 a8。","a":["g2d5"]},{"u":"d5b6","san":"Nb6","c":"Black's knight retreats to b6, stepping off the long diagonal before your bishop can build up pressure against it.","cZh":"黑马退到 b6，提前躲开你 g2 象在长斜线上的压力。"},{"u":"e1g1","san":"O-O","c":"Castle: the king tucks into safety and the rook joins the game. Your development (getting pieces out) is nearly complete.","cZh":"王车易位，王入安全角落，车也参战，白方出子接近完成。"},{"u":"f8e7","san":"Be7","c":"Black develops the bishop to e7, catching up in development.","cZh":"黑方象出 e7，追赶出子进度。"},{"u":"d2d3","san":"d3","c":"A modest pawn move, but flexible: d3 supports your next plans of pushing e4 in the centre or b4 on the queenside.","cZh":"低调却灵活的一步：d3 为接下来推 e4 或 b4 留好选择。"},{"u":"e8g8","san":"O-O","c":"Black castles too. Both kings are now safe, and the real plans can begin.","cZh":"黑方也易位，双方王都安全了，接下来进入计划阶段。"},{"u":"a2a3","san":"a3","c":"A small pawn step with a big idea: a3 prepares b4 and then b5, the typical English queenside pawn storm to grab space on that wing.","cZh":"小兵一步藏着大计划：a3 准备 b4 再 b5，这是英国式开局典型的后翼兵潮，抢占那一翼的空间。","a":["b2b4"]}]},{"name":"Symmetrical (1...c5)","nameZh":"对称变例（1...c5）","intro":"Black mirrors you. Patience wins: tiny edges in development and space decide these games.","introZh":"黑方照搬你的布局。耐心制胜：出子与空间的微小优势决定成败。","plan":"Break symmetry at the right moment — usually with d4 or b4. Your extra tempo means you break first.","planZh":"在正确时机打破对称——通常是 d4 或 b4。你多一步，先动手。","moves":[{"u":"c2c4","san":"c4","c":"Start from the flank (the side of the board): the c-pawn controls the key d5 square without committing your central pawns yet.","cZh":"侧翼起手：c 兵控制关键的 d5 格，中心兵暂不表态。"},{"u":"c7c5","san":"c5","c":"Black copies you with the mirror move c5, controlling d4 from the side in the same way.","cZh":"黑方照搬走 c5，以同样方式从侧翼控制 d4。"},{"u":"g1f3","san":"Nf3","c":"Develop the knight (bring it off the back rank) to f3, toward the centre.","cZh":"出马到 f3，向中心发展。"},{"u":"g8f6","san":"Nf6","c":"Black develops the same knight to f6 — the symmetry continues.","cZh":"黑方同样出马到 f6，继续对称。"},{"u":"b1c3","san":"Nc3","c":"The second knight comes out to c3 and joins the fight for the key d5 square.","cZh":"第二只马出到 c3，加入对关键 d5 格的争夺。"},{"u":"b8c6","san":"Nc6","c":"Black mirrors again, developing the queenside knight to c6.","cZh":"黑方继续照搬，出后翼马到 c6。"},{"u":"g2g3","san":"g3","c":"Prepare the fianchetto (bishop on the long diagonal): your light-squared bishop is headed for g2.","cZh":"准备侧翼出象（象上长斜线）：白格象即将落到 g2。"},{"u":"d7d5","san":"d5","c":"Black breaks the symmetry and strikes first in the centre with d5. That's fine — the lines this opens work for you too.","cZh":"黑方打破对称，率先推 d5 突破中心。无妨——打开的线路对你同样有利。"},{"u":"c4d5","san":"cxd5","c":"Capture the pawn with your c-pawn — the natural reply.","cZh":"c 兵吃掉 d5 兵，自然的应对。"},{"u":"f6d5","san":"Nxd5","c":"Black's knight recaptures the pawn on d5.","cZh":"黑马吃回 d5 兵。"},{"u":"f1g2","san":"Bg2","c":"The bishop arrives on g2 and takes charge of the long diagonal pointing at Black's queenside. Your f3 knight blocks it for the moment, but the knight on d5 already feels the latent pressure.","cZh":"象上 g2，掌控指向黑方后翼的长斜线。f3 马暂时挡住视线，但 d5 马已经感受到潜在的压力。","a":["g2b7"]},{"u":"d5c7","san":"Nc7","c":"The Rubinstein retreat: Black's knight drops back to c7. From there it still guards the d5 square and can later hop to e6.","cZh":"鲁宾斯坦式后撤：黑马退到 c7，仍看住 d5 格，之后还可跳往 e6。"},{"u":"e1g1","san":"O-O","c":"Castle: your king moves to safety and the rook is ready for action.","cZh":"王车易位，王入安全，车也准备参战。"},{"u":"e7e5","san":"e5","c":"Black pushes e5 to build a broad pawn centre. It looks impressive, but those advanced pawns can become targets for you to attack.","cZh":"黑方推 e5 筑起大兵中心——看似气派，但挺进的兵也可能成为你攻击的靶子。"},{"u":"d2d3","san":"d3","c":"Keep your centre modest with d3 and restrain Black's pawns first. Later you can strike with the knight route Nd2-c4, or with the pawn breaks f4 or b4.","cZh":"先以 d3 限制黑方兵阵，之后可走 Nd2-c4 调马出击，或用 f4、b4 兵突破。"},{"u":"f8e7","san":"Be7","c":"Black develops the bishop to e7, a simple step that keeps bringing pieces out.","cZh":"黑方象出 e7，继续简单出子。"},{"u":"f3d2","san":"Nd2","c":"Reroute the knight: it steps back from f3 to d2 so it can jump to c4 next, where it will nibble at Black's e5 pawn and the d6 square.","cZh":"调动马的路线：马从 f3 退回 d2，准备跳上 c4，啃咬黑方 e5 兵与 d6 格。","a":["d2c4"]}]}]},{"name":"Catalan Opening","nameZh":"卡塔兰开局","side":"w","icon":"♗","desc":"Queen's Gambit plus kingside fianchetto: quiet moves, lasting pressure. A favourite of world champions.","descZh":"后翼弃兵加王翼侧象：着法平静，压力持久。众多世界冠军的心头好。","lines":[{"name":"Open Catalan","nameZh":"开放卡塔兰","intro":"Black takes on c4 and tries to keep the pawn. Your g2-bishop and queen win it back with interest.","introZh":"黑方吃 c4 并试图保住。g2 主教与皇后会连本带利收回。","plan":"Regain c4, then press b7/a8 on the long diagonal. Rd1, Bd2/Bg5, and a timely e4 complete the squeeze.","planZh":"收回 c4 后沿长斜线压 b7/a8。Rd1、Bd2/Bg5 加适时 e4 完成绞杀。","moves":[{"u":"d2d4","san":"d4","c":"Push your queen's pawn two squares to claim the center. It also opens lines for your queen and dark-squared bishop.","cZh":"后兵前进两格抢占中心，同时为皇后和黑格象打开出路。"},{"u":"g8f6","san":"Nf6","c":"Black develops a knight (brings a piece off the back rank). From f6 it controls the central squares e4 and d5 without committing any pawns yet.","cZh":"黑方跳马出子，从 f6 控制中心格 e4 和 d5，兵形暂不表态。"},{"u":"c2c4","san":"c4","c":"Advance the c-pawn to gain space and add pressure on the center, just like in the Queen's Gambit.","cZh":"推 c 兵夺取空间，向中心施压，与后翼弃兵思路相同。"},{"u":"e7e6","san":"e6","c":"A solid reply: the e6 pawn supports a coming ...d5 and opens the diagonal for Black's dark-squared bishop.","cZh":"稳健应法：e6 兵支援下一步 ...d5，并为黑格象让路。"},{"u":"g2g3","san":"g3","c":"This is the Catalan move. White prepares a fianchetto (putting the bishop on the long diagonal): the bishop will live on g2 and press across the whole board.","cZh":"卡塔兰标志性一着：准备侧翼出象，白格象将常驻 g2，沿长斜线施压全局。"},{"u":"d7d5","san":"d5","c":"Black plants a pawn on d5, taking the classical center and fighting for space.","cZh":"黑方挺 d5 兵，占据古典中心，正面争夺空间。"},{"u":"f1g2","san":"Bg2","c":"The Catalan bishop arrives on g2 — the whole opening revolves around this piece. It aims down the long light-squared diagonal at Black's queenside.","cZh":"卡塔兰象就位 g2，整个开局围绕它展开——它沿白格长斜线直指黑方后翼。","a":["g2a8"]},{"u":"d5c4","san":"dxc4","c":"Black grabs the c4 pawn: this is the Open Catalan. The center opens up, which is exactly what your g2 bishop wants.","cZh":"黑方吃掉 c4 兵，进入开放卡塔兰。中心随之打开，正合 g2 象的心意。"},{"u":"g1f3","san":"Nf3","c":"No hurry to chase the pawn. Develop the knight first — it controls the center and prepares castling, and the pawn will come back later.","cZh":"不急着追兵——先出马控制中心、准备易位，失兵稍后自会收回。"},{"u":"f8e7","san":"Be7","c":"Black develops the bishop to e7 so the king can castle to safety as soon as possible.","cZh":"黑方出象到 e7，为尽快王车易位、让王进入安全角落做准备。"},{"u":"e1g1","san":"O-O","c":"Castle first: tuck your king safely in the corner before going to collect the c4 pawn.","cZh":"先易位保证王的安全，然后再去收回 c4 兵。"},{"u":"e8g8","san":"O-O","c":"Black castles too. Both kings are safe, and now the fight over the c4 pawn begins.","cZh":"黑方也完成易位。双方王都安全了，接下来围绕 c4 兵展开较量。"},{"u":"d1c2","san":"Qc2","c":"Your queen slides to c2 and takes aim at the c4 pawn — it is coming home soon.","cZh":"皇后移到 c2，瞄准 c4 兵——失兵很快就要归队。","a":["c2c4"]},{"u":"a7a6","san":"a6","c":"Black plays ...a6 to prepare ...b5, hoping to protect the c4 pawn and keep the extra material.","cZh":"黑方走 a6，准备用 ...b5 保住 c4 兵，想守住多出的一兵。"},{"u":"c2c4","san":"Qxc4","c":"Take the pawn back at just the right moment — one move before ...b5 could have defended it. Material is level again.","cZh":"皇后及时吃回 c4 兵，抢在 ...b5 护兵之前，子力重归均势。"},{"u":"b7b5","san":"b5","c":"Black pushes ...b5 to gain space and chase your queen, but it comes at a price: the c6 square and the long diagonal are now weaker.","cZh":"黑方推 b5 扩张空间并驱赶皇后，但代价是削弱了 c6 格和长斜线。","k":["c6"]},{"u":"c4c2","san":"Qc2","c":"The queen calmly retreats to c2. Black's queenside pawn pushes have left holes (weak squares) where your pieces can settle later.","cZh":"皇后从容退回 c2。黑方后翼兵形已千疮百孔，那些弱格正好日后安置你的子力。"},{"u":"c8b7","san":"Bb7","c":"Black puts the bishop on b7 to oppose your Catalan bishop on the long diagonal. Answer with a4! and reroute a knight via Nbd2-b3 to keep the pressure on.","cZh":"黑方象上 b7，在长斜线上对抗卡塔兰象——用 a4! 并经 Nbd2-b3 调马，可继续保持压力。"}]},{"name":"Closed Catalan","nameZh":"封闭卡塔兰","intro":"Black declines the pawn and builds a solid but slightly passive wall.","introZh":"黑方不吃兵，筑起坚固却略显被动的壁垒。","plan":"Space and patience: b3/Bb2, e4 at the right time. Black is solid but cramped — avoid trades, expand slowly.","planZh":"空间与耐心：b3/Bb2，适时 e4。黑方坚固但憋闷——避免兑子，缓步扩张。","moves":[{"u":"d2d4","san":"d4","c":"Push the queen's pawn two squares: it stakes a claim in the center and frees your queen and dark-squared bishop.","cZh":"后兵前进两格，抢占中心，并为皇后和黑格象打开通路。"},{"u":"g8f6","san":"Nf6","c":"Black develops a knight (brings a piece off the back rank), controlling the central squares e4 and d5.","cZh":"黑方跳马出子，控制中心格 e4 和 d5。"},{"u":"c2c4","san":"c4","c":"Advance the c-pawn to grab more space and strengthen your grip on the center.","cZh":"推 c 兵夺取更多空间，加强对中心的控制。"},{"u":"e7e6","san":"e6","c":"A solid move: Black supports a coming ...d5 and opens the diagonal for the dark-squared bishop.","cZh":"稳固一着：支援下一步 ...d5，同时为黑格象让路。"},{"u":"g2g3","san":"g3","c":"The Catalan move: White prepares a fianchetto (bishop on the long diagonal) with Bg2 next.","cZh":"卡塔兰之着：准备侧翼出象，白格象即将上 g2 控制长斜线。"},{"u":"d7d5","san":"d5","c":"Black plants a pawn on d5, claiming a fair share of the center.","cZh":"黑方挺 d5 兵，占据中心。"},{"u":"f1g2","san":"Bg2","c":"The key Catalan bishop lands on g2, pointing down the long diagonal toward Black's queenside.","cZh":"关键的卡塔兰象落位 g2，沿长斜线遥指黑方后翼。"},{"u":"f8e7","san":"Be7","c":"Black leaves the c4 pawn alone and simply develops the bishop: this is the Closed Catalan. Solid, but a little passive.","cZh":"黑方不吃 c4 兵，只管出象发展：封闭卡塔兰。稳固，但稍显被动。"},{"u":"g1f3","san":"Nf3","c":"Develop the kingside knight: it supports the center and prepares castling.","cZh":"出王翼马，支援中心并为易位做准备。"},{"u":"e8g8","san":"O-O","c":"Black castles, sliding the king into the safe corner.","cZh":"黑方王车易位，国王入驻安全角落。"},{"u":"e1g1","san":"O-O","c":"You castle too. Both kings are safe, and the middlegame plans can begin.","cZh":"白方随之易位。双方王都安全了，中局计划就此展开。"},{"u":"b8d7","san":"Nbd7","c":"Black develops the queen's knight to d7, preparing ...c6 and ...b6 to free the light-squared bishop stuck on c8.","cZh":"黑方后翼马跳 d7，准备走 ...c6、...b6，解放憋在 c8 的白格象。"},{"u":"d1c2","san":"Qc2","c":"The queen goes to c2: it supports a future e4 push and keeps an eye on any trades along the c-file.","cZh":"皇后走 c2，支援日后的 e4 突破，同时兼顾 c 线上的兑换。"},{"u":"c7c6","san":"c6","c":"With ...c6 Black completes the solid pawn wall — but at a cost: the bishop headed for b7 will be buried behind its own pawns.","cZh":"黑方走 c6 筑成坚固兵墙——但代价是将上 b7 的象被自家兵埋住。","k":["b7"]},{"u":"b1d2","san":"Nbd2","c":"The queen's knight develops to d2. Every white piece now works toward the same goal: the e4 pawn break.","cZh":"后翼马出到 d2。白方所有子力都在为 e4 突破服务。","a":["e2e4"]},{"u":"b7b6","san":"b6","c":"Black pushes ...b6, finally working to dig the light-squared bishop out of its corner.","cZh":"黑方推 b6，终于着手把白格象从角落里解放出来。"},{"u":"e2e4","san":"e4","c":"The thematic break (a pawn push that opens the position): e4 opens the center at the moment your pieces are better placed, so the open lines favor you.","cZh":"主题性突破：e4 打开中心，此刻你的子力更协调，开放局面对你有利。","a":["e4e5"]}]}]},{"name":"King's Indian Defense","nameZh":"王翼印度防御","side":"b","icon":"♚","desc":"Give White the big centre, then burn it down with ...e5 and a kingside pawn storm. The fighter's choice against 1.d4.","descZh":"先让白方占大中心，再用 ...e5 与王翼兵潮将其焚毁。应对 1.d4 的斗士之选。","lines":[{"name":"Classical Main Line","nameZh":"古典主变","intro":"The full point of the KID: the centre locks, White plays on the queenside, you attack the king.","introZh":"王印的精髓：中心封锁后，白方走后翼，你直攻王城。","plan":"After ...Nd7 comes ...f5-f4 and the pawn storm: ...g5, ...Rf6-g6/h6, mate ideas on g2/h2. Speed matters more than material.","planZh":"...Nd7 之后就是 ...f5-f4 兵潮：...g5、...Rf6 转 g6/h6，瞄准 g2/h2 杀王。速度重于子力。","moves":[{"u":"d2d4","san":"d4","c":"White pushes the d-pawn two squares to grab space in the centre. Central pawns control key squares and give the pieces room to develop.","cZh":"白方挺 d4 抢占中心。中心兵控制要点，为出子打开空间。"},{"u":"g8f6","san":"Nf6","c":"Black develops the knight (brings a piece off the back rank) and controls the e4 square, so White cannot take the whole centre right away.","cZh":"黑马跳 f6 出子，先控制 e4 格，不让白方轻易占满中心。"},{"u":"c2c4","san":"c4","c":"White pushes a second pawn to grab even more space and support building a big pawn centre.","cZh":"白方再推 c4，扩大空间，支撑大中心。"},{"u":"g7g6","san":"g6","c":"This starts the King's Indian Defense. Black prepares a fianchetto (bishop on the long diagonal): the bishop will go to g7 and strike at the centre from a distance.","cZh":"王翼印度防御的标志。黑方准备侧翼出象：象将上 g7，沿长斜线远程打击中心。"},{"u":"b1c3","san":"Nc3","c":"White develops the knight to c3, supporting the e4 square so the pawn can advance there next.","cZh":"白马跳 c3 出子，支援 e4 格，为下一步挺 e4 做准备。"},{"u":"f8g7","san":"Bg7","c":"The bishop lands on g7 — the famous dragon bishop. From here it aims down the long diagonal at White's centre and will power Black's play later.","cZh":"象上 g7 就位——这条“龙象”沿长斜线瞄准白方中心，日后将是反击主力。","a":["g7d4"]},{"u":"e2e4","san":"e4","c":"White builds the ideal pawn centre with d4, c4 and e4. Don't panic — the King's Indian plan is to let White have it now and attack it later.","cZh":"白方以 d4、c4、e4 筑起理想大中心。别慌——王印的思路就是先随他占，之后再反击。"},{"u":"d7d6","san":"d6","c":"This small pawn move does two jobs: it stops White's pawn from pushing on to e5, and it opens the path for Black's c8-bishop.","cZh":"小兵 d6 一举两得：挡住白兵冲 e5，也为 c8 象打开出路。"},{"u":"g1f3","san":"Nf3","c":"White develops the knight to its natural square, adding control of the centre and getting ready to castle.","cZh":"白马跳 f3 出子，控制中心并准备易位。"},{"u":"e8g8","san":"O-O","c":"Black castles (tucks the king safely in the corner) before starting anything. The coming counterattack only works if your own king is safe first.","cZh":"黑方先易位，把王安置妥当。想发动反击，前提是自己的王足够安全。"},{"u":"f1e2","san":"Be2","c":"White develops the bishop to e2 and prepares to castle. This quiet move marks the Classical setup, the main line of the King's Indian.","cZh":"白象上 e2 准备易位。这就是古典变例——王印最主流的布局。"},{"u":"e7e5","san":"e5","c":"The heart of the King's Indian: Black finally strikes back in the centre. This pawn challenges d4 and stakes Black's claim to the middle of the board.","cZh":"王印的灵魂一步：黑方终于在中心反击，...e5 直接挑战 d4，宣示对中心的权利。","k":["e5","d4"]},{"u":"e1g1","san":"O-O","c":"White simply castles and keeps the central tension. Instead of trading or pushing pawns right away, White waits to see Black's plan.","cZh":"白方直接易位，不急着兑兵或推兵，保持中心张力，静观其变。"},{"u":"b8c6","san":"Nc6","c":"The knight adds another attacker to White's d4 pawn. Black is nudging White to push d4-d5, which would lock the centre.","cZh":"马跳 c6 再添一子施压 d4，逼白方推 d5 封闭中心。","a":["c6d4"]},{"u":"d4d5","san":"d5","c":"White pushes the pawn to d5 and the centre locks shut. From now on it's a race: White attacks on the queenside while Black storms the kingside.","cZh":"白兵推至 d5，中心封锁。此后就是赛跑：白方攻后翼，黑方冲王翼。"},{"u":"c6e7","san":"Ne7","c":"The attacked knight steps back to e7. It isn't retreating for good — it's rerouting toward the kingside, where Black's attack will unfold.","cZh":"被驱赶的马退到 e7，并非示弱，而是转场王翼，为进攻集结。"},{"u":"f3e1","san":"Ne1","c":"White tucks the knight back to e1. This frees the f-pawn to support the centre with f3, and the knight can re-emerge on d3, where it backs up White's queenside pawn break c5.","cZh":"白马回撤 e1：一来腾出 f 兵走 f3 稳固中心，二来马可转到 d3，支援后翼的 c5 突破。"},{"u":"f6d7","san":"Nd7","c":"Black's knight drops back to d7, unblocking the f-pawn. The signal is clear: ...f5 comes next, launching the kingside pawn storm this opening is famous for.","cZh":"黑马退 d7 给 f 兵让路。信号明确：下一步 ...f5，王翼兵潮就此启动。","a":["f7f5"]}]},{"name":"Fianchetto Variation","nameZh":"侧象变例","intro":"White's safest setup — the g2-bishop blunts your attack, so switch plans: pressure the centre instead.","introZh":"白方最稳的布局——g2 象削弱你的攻势，故改变计划：转而压迫中心。","plan":"No pawn storm here. Play ...c6, ...Qb6/...Qa5, ...exd4 and use the e- and d-files; the g7-bishop still bites.","planZh":"这里没有兵潮。改用 ...c6、...Qb6/...Qa5、...exd4，利用 e、d 线；g7 象依旧咬人。","moves":[{"u":"d2d4","san":"d4","c":"White grabs space in the centre with the queen's pawn — the standard start to a 1.d4 opening.","cZh":"白方挺 d4 抢占中心，1.d4 开局的标准起手。"},{"u":"g8f6","san":"Nf6","c":"Black develops the knight (brings a piece into play) and keeps an eye on the e4 square.","cZh":"黑马跳 f6 出子，同时盯住 e4 格。"},{"u":"c2c4","san":"c4","c":"A second pawn joins in, giving White extra space and a stronger grip on the centre.","cZh":"白方再推 c4，扩张空间，加强对中心的控制。"},{"u":"g7g6","san":"g6","c":"The King's Indian move: Black prepares a fianchetto (bishop on the long diagonal), planning to put the bishop on g7.","cZh":"王印标志：黑方准备侧翼出象，象将落在 g7 的长斜线上。"},{"u":"g1f3","san":"Nf3","c":"White develops the knight but stays flexible, avoiding early commitments in the centre for now.","cZh":"白马跳 f3 出子，但保持弹性，暂不在中心过早定型。"},{"u":"f8g7","san":"Bg7","c":"The bishop takes its usual home on g7, eyeing the long diagonal toward the centre — the same setup as in every King's Indian.","cZh":"黑象照例上 g7，沿长斜线注视中心——王印的固定配置。"},{"u":"g2g3","san":"g3","c":"This is the Fianchetto Variation: White copies Black's idea and prepares to put a bishop on the long diagonal too. It's White's safest setup against the King's Indian.","cZh":"侧象变例：白方照搬你的思路，也要把象架上长斜线。这是对付王印最稳健的布局。"},{"u":"e8g8","san":"O-O","c":"Black castles early, tucking the king into safety before choosing a plan.","cZh":"黑方早早易位，先把王藏好再谈计划。"},{"u":"f1g2","san":"Bg2","c":"White's bishop settles on g2. The two fianchettoed bishops now stare at each other down the long diagonals, and this one shields White's king well.","cZh":"白象上 g2，双方的象各据长斜线遥遥相对，这枚象也把白王护得严实。"},{"u":"d7d6","san":"d6","c":"The standard King's Indian pawn move: it controls e5 and will let the c8-bishop out later.","cZh":"王印的标准一步：d6 控制 e5 格，日后也给 c8 象让路。"},{"u":"e1g1","san":"O-O","c":"White castles too. Both kings are now safely tucked away, and the middlegame plans can begin.","cZh":"白方也易位。双王均已安顿，接下来进入中局较量。"},{"u":"b8d7","san":"Nbd7","c":"The queenside knight develops to d7 to support ...e5 — the freeing pawn break that gives Black's pieces room to breathe.","cZh":"黑方 b8 马上 d7，支援解放性的 ...e5 突破，让子力获得空间。"},{"u":"b1c3","san":"Nc3","c":"White develops the queenside knight to c3, adding control of the central squares d5 and e4 and preparing to push the e-pawn next.","cZh":"白马跳 c3 出子，控制 d5、e4 两个中心格，为下一步挺 e4 做准备。"},{"u":"e7e5","san":"e5","c":"There it is — the thematic King's Indian break. Black strikes at White's centre and frees his position.","cZh":"如期而至的 ...e5：黑方向白方中心发起反击，盘活阵型。"},{"u":"e2e4","san":"e4","c":"White pushes e4 to clamp down on the centre, holding everything firmly in place.","cZh":"白方挺 e4 钳住中心，把局面牢牢稳住。"},{"u":"c7c6","san":"c6","c":"A key move: the pawn controls the d5 square and opens the way for ...Qb6, seeking counterplay on the queenside instead of the usual kingside attack.","cZh":"关键一步：c6 控制 d5 格，为 ...Qb6 铺路，转向后翼寻找反击。","k":["d5"]},{"u":"h2h3","san":"h3","c":"A useful little pawn move: White takes away the g4 square so Black's bishop or knight can't jump in with ...Bg4 or ...Ng4.","cZh":"白方走 h3 未雨绸缪，封掉 g4 格，防止黑方 ...Bg4 或 ...Ng4 骚扰。"},{"u":"d8b6","san":"Qb6","c":"The queen leaps out to b6, attacking the b2 pawn and the d4 pawn at the same time. Defending both at once is awkward, so White must stop and react.","cZh":"黑后跳上 b6，同时敲打 b2 与 d4 两兵。一子攻两处，白方顾此失彼，必须停下应对。","a":["b6b2","b6d4"]}]}]},{"name":"Nimzo-Indian Defense","nameZh":"尼姆佐印度防御","side":"b","icon":"♞","desc":"Pin the c3-knight, fight for e4, and saddle White with doubled pawns. The most respected reply to 1.d4.","descZh":"牵制 c3 马、争夺 e4、送白方叠兵。应对 1.d4 最受尊敬的防御。","lines":[{"name":"Rubinstein (4.e3)","nameZh":"鲁宾斯坦体系（4.e3）","intro":"White develops modestly. You get easy piece play and a clear plan against the centre.","introZh":"白方稳健出子。你的子力活跃，对中心的计划清晰。","plan":"Trade on c4 and d4 at the right moments, put pressure on d4 with ...b6/...Bb7, and blockade any isolated pawn.","planZh":"在恰当时机在 c4、d4 交换，用 ...b6/...Bb7 压 d4，并封锁可能出现的孤兵。","moves":[{"u":"d2d4","san":"d4","c":"White pushes the queen's pawn two squares to claim the centre. Centre pawns control key squares and open lines for the pieces behind them.","cZh":"白方挺d兵两格抢占中心。中心兵控制要格，也为后面的子力打开通道。"},{"u":"g8f6","san":"Nf6","c":"Develop your knight (bring a piece off the back rank) and take control of the e4 square, so White cannot easily build a big pawn centre with e4.","cZh":"出马到f6，控制e4格，让白方无法轻松挺e4建立大中心。"},{"u":"c2c4","san":"c4","c":"White adds a second pawn to the fight for the centre, gaining space — more room for the pieces to move around.","cZh":"白方再挺c兵争夺中心，扩大空间，让子力活动更自如。"},{"u":"e7e6","san":"e6","c":"This quiet pawn move opens the diagonal for your dark-squared bishop and keeps two plans ready: ...Bb4 to pin the knight, or ...d5 to fight in the centre.","cZh":"e6打开黑格象的斜线，同时保留两手棋：...Bb4牵制，或...d5争夺中心。"},{"u":"b1c3","san":"Nc3","c":"White develops the knight to support pushing the e-pawn to e4. If you allow that, White gets a strong centre — so you must act right now.","cZh":"白方出马，为挺e4做准备。若放任不管，白方将建立强大中心——必须立刻阻止。"},{"u":"f8b4","san":"Bb4","c":"The signature Nimzo move: your bishop pins the c3-knight — it cannot move, or the white king would be in check. Since that knight was the supporter of e4, the e4 push is frozen.","cZh":"尼姆佐招牌一手：象牵制c3马——马一动，白王就被将军。这匹马正是e4的支援，e4推进就此被冻结。","a":["b4c3"]},{"u":"e2e3","san":"e3","c":"The solid Rubinstein choice: a small pawn move that opens the way for White's f1-bishop instead of forcing matters in the centre.","cZh":"稳健的鲁宾斯坦选择：小兵上e3为白格象开路，不急于在中心强行推进。"},{"u":"e8g8","san":"O-O","c":"Castle to tuck your king safely in the corner first. You wait to see White's setup before deciding your own pawn structure.","cZh":"先易位保证王的安全，看清白方阵型后再决定自己的兵形。"},{"u":"f1d3","san":"Bd3","c":"White develops the bishop to a natural square, pointing it at Black's kingside. One more piece — the g1-knight — must still move before White can castle.","cZh":"白方自然出象到d3，指向黑方王翼；等g1马再出动，白方就能易位。"},{"u":"d7d5","san":"d5","c":"Push your d-pawn two squares to stake your own claim in the centre. Now both sides have pawns fighting for the middle of the board.","cZh":"挺d5，在中心占据自己的一份地盘，双方就此正面争夺中路。"},{"u":"g1f3","san":"Nf3","c":"White develops the knight toward the centre and gets ready to castle.","cZh":"白方出马靠向中心，准备易位。"},{"u":"c7c5","san":"c5","c":"Strike at White's d4-pawn with your c-pawn. In this line Black plays actively, challenging the centre right away instead of sitting back.","cZh":"以c5冲击白方d4兵。本变例黑方下法积极，立刻向中心发难，绝不被动等待。"},{"u":"e1g1","san":"O-O","c":"White castles, completing kingside development and bringing the king to safety.","cZh":"白方易位，完成王翼出子，王也进入安全位置。"},{"u":"d5c4","san":"dxc4","c":"Capture on c4 at just the right moment. White's bishop already spent a move going to d3 and must now move again to take back — so you win that time (tempo) back for free.","cZh":"时机正好：吃c4兵。白象刚花一步到d3，现在还得再动一步吃回——你白赚回这个步调。"},{"u":"d3c4","san":"Bxc4","c":"The bishop recaptures the pawn — its second move, exactly the time loss you planned for.","cZh":"白象吃回c4兵——这已是它第二次移动，正中你的算盘。"},{"u":"c5d4","san":"cxd4","c":"Trade pawns to clarify the centre: once the dust settles, the pawn structure is fixed and you know exactly what you are playing against.","cZh":"兑掉中心兵、厘清局面：兵形定型后，你的目标一清二楚。"},{"u":"e3d4","san":"exd4","c":"White recaptures and accepts an isolated d-pawn — a pawn with no neighbouring pawns to guard it. White gets active pieces for now; you get a long-term weakness to attack.","cZh":"白方吃回，接受孤d兵（两侧无友兵保护）。白方换来一时的子力活跃，你则得到长期攻击目标。","k":["d4","d5"]},{"u":"b7b6","san":"b6","c":"Begin the blockade plan: the bishop goes to b7, a knight to d7, and eventually a knight lands on d5 — right in front of the isolated pawn, so it can never advance.","cZh":"启动封锁计划：象上b7、马走d7，最终一马驻扎d5——正堵在孤兵前面，让它永远无法前进。","a":["c8b7"]}]},{"name":"Classical (4.Qc2)","nameZh":"古典体系（4.Qc2）","intro":"White avoids doubled pawns at the cost of time. Take the bishop pair fight to him.","introZh":"白方花时间避免叠兵。你就跟他比拼双象与出子速度。","plan":"Give up the bishop pair for structure and speed: ...b6, ...Bb7, ...d5. Your lead in development balances the bishops.","planZh":"以双象换结构与速度：...b6、...Bb7、...d5。出子领先足以抗衡双象。","moves":[{"u":"d2d4","san":"d4","c":"White pushes the queen's pawn two squares to grab the centre — controlling key central squares and opening lines for the pieces.","cZh":"白方挺d4抢占中心，控制中央要格，也为子力出动开路。"},{"u":"g8f6","san":"Nf6","c":"Bring your knight out toward the centre — developing (getting a piece off the back rank) while keeping an eye on the e4 square.","cZh":"出马到f6，出子的同时盯住e4格。"},{"u":"c2c4","san":"c4","c":"White plays a second centre pawn to gain space — extra room to maneuver behind the pawns.","cZh":"白方挺c4扩大空间，为子力争取更多活动余地。"},{"u":"e7e6","san":"e6","c":"A flexible pawn move: it opens the diagonal for your dark-squared bishop while keeping your plans open.","cZh":"灵活的一手：打开黑格象的斜线，同时保留多种计划。"},{"u":"b1c3","san":"Nc3","c":"White develops the knight to prepare the big central push e4.","cZh":"白方出马，为挺e4占领中心做准备。"},{"u":"f8b4","san":"Bb4","c":"The Nimzo pin: your bishop pins the c3-knight against the king — the knight cannot legally move, so it cannot help push e4.","cZh":"尼姆佐牵制：象钉住c3马（马动则王被将军），它再也帮不上e4的忙。"},{"u":"d1c2","san":"Qc2","c":"White guards the c3-knight with the queen. The idea: if you ever capture on c3, the queen takes back, so White avoids doubled pawns (two pawns stuck on the same file).","cZh":"白后护住c3马：将来你吃马时由皇后吃回，白方就避免了叠兵（同一直线上的双兵）。"},{"u":"e8g8","san":"O-O","c":"Castle your king to safety. White just spent a move on the queen instead of developing a piece, so you quietly pull ahead in the development race.","cZh":"先易位保王。白方花步数走皇后而非出子，你悄悄在出子竞赛中领先。"},{"u":"a2a3","san":"a3","c":"White pushes the a-pawn to put the question to your bishop: take the knight or retreat? You must decide right now.","cZh":"白方a3摊牌，逼问你的象：吃马还是撤退？必须立刻表态。"},{"u":"b4c3","san":"Bxc3+","c":"Take the knight — and it comes with check, so White has no chance for an in-between move (zwischenzug) and must deal with the check at once.","cZh":"吃马并将军！白方没有任何中间着可插，必须马上应将。"},{"u":"c2c3","san":"Qxc3","c":"The queen recaptures. White gains the bishop pair — two bishops working together, while you keep one bishop and both knights. But the queen has now moved twice; that lost time is yours to use.","cZh":"皇后吃回。白方得到双象，但皇后已连动两步，这些时间正好为你所用。"},{"u":"b7b6","san":"b6","c":"Prepare a fianchetto (bishop on the long diagonal): your light-squared bishop will come to b7 and aim across the whole board.","cZh":"准备斜线出象：白格象将上b7，遥控整条长斜线。"},{"u":"c1g5","san":"Bg5","c":"White pins your f6-knight to the queen behind it and joins the fight for the e4 square.","cZh":"白象g5牵制f6马（马后是你的皇后），同时加入对e4格的争夺。"},{"u":"c8b7","san":"Bb7","c":"Complete the fianchetto: from b7 your bishop bites into e4 and even eyes the g2-square next to White's future king position.","cZh":"完成出象：b7的象咬住e4，还远远瞄着白方王翼的g2格。","a":["b7g2"]},{"u":"f2f3","san":"f3","c":"White supports the plan of pushing e4 with the f-pawn — but this loosens the squares around the white king. Remember that weakness for later.","cZh":"白方f3巩固e4计划——却松动了王城周围的格子，记住这个弱点。","k":["e3","g3"]},{"u":"h7h6","san":"h6","c":"Poke the g5-bishop with your h-pawn — putting the question to it: retreat or take the knight? It must decide on the spot.","cZh":"h6逼问白象：是撤退还是吃马？必须当场做出选择。"},{"u":"g5h4","san":"Bh4","c":"The bishop drops back to h4 and keeps the pin on your f6-knight.","cZh":"白象退到h4，继续保持对f6马的牵制。"},{"u":"d7d5","san":"d5","c":"The central break: push d5 to open the game while White's king is still stuck in the middle. Open lines favour the better-developed side — and that side is you.","cZh":"中心突破：挺d5打开局面，此时白王仍留在中路——开放局面有利于出子领先的一方，也就是你。"}]}]},{"name":"Grünfeld Defense","nameZh":"格林菲尔德防御","side":"b","icon":"♜","desc":"Invite White's big centre, then hit it with pieces: ...d5, ...c5, the g7-bishop. Dynamic and concrete.","descZh":"引诱白方筑起大中心，再用子力痛击：...d5、...c5 加 g7 象。动态而具体。","lines":[{"name":"Exchange Variation","nameZh":"交换变例","intro":"The main battlefield: White gets a broad centre, you get targets on c3 and d4.","introZh":"主战场：白方获得宽中心，你获得 c3、d4 两个靶子。","plan":"Everything hits d4: ...c5, ...Nc6, ...Bg4, ...Qa5. If d4 falls or advances, your endgame is often better.","planZh":"全员围攻 d4：...c5、...Nc6、...Bg4、...Qa5。d4 一旦倒下或冒进，残局常对你有利。","moves":[{"u":"d2d4","san":"d4","c":"White pushes a pawn two squares to claim the center. Central pawns control key squares and open lines for the queen and bishop behind them.","cZh":"白方挺兵 d4 抢占中心。中心兵控制要格，也为后面的后和象打开出路。"},{"u":"g8f6","san":"Nf6","c":"Black develops (brings a piece off the back rank) the knight to f6, its best square, where it controls the central squares e4 and d5.","cZh":"黑方出马到 f6——马的最佳位置，控制 e4、d5 两个中心格。"},{"u":"c2c4","san":"c4","c":"White pushes a second pawn to grab space (more room for the pieces to move) and take aim at the d5-square.","cZh":"白方再挺 c4 兵，扩大空间，并瞄准 d5 格。"},{"u":"g7g6","san":"g6","c":"Black prepares a fianchetto (putting the bishop on the long diagonal). The bishop will sit on g7 and hit the center from a distance — this is classic Grünfeld territory.","cZh":"黑方准备侧翼出象：象将上 g7，沿长斜线远远瞄准中心。这正是格林菲尔德防御的标志。"},{"u":"b1c3","san":"Nc3","c":"White develops the knight, adding control of the d5-square and preparing to build a big center with e4.","cZh":"白方出马 c3，加强对 d5 格的控制，并为挺 e4 组建大中心做准备。"},{"u":"d7d5","san":"d5","c":"The signature Grünfeld strike: Black hits the center at once, and the d5-pawn directly challenges White's c4-pawn. This counterpunch defines the whole opening.","cZh":"格林菲尔德的招牌一击：黑方立刻挺 d5 反击中心，直接挑战白方的 c4 兵。这一记反击定义了整个开局。"},{"u":"c4d5","san":"cxd5","c":"White takes the pawn, accepting the challenge. This is the Exchange Variation, where White aims to build a broad pawn center.","cZh":"白方吃兵接受挑战，进入交换变例——白方将着手建立宽大的兵中心。"},{"u":"f6d5","san":"Nxd5","c":"Black takes back with the knight. Don't get attached to it: the plan is to trade this knight for White's knight on c3 very soon.","cZh":"黑方用马吃回。别舍不得这匹马——它的使命就是稍后换掉白方 c3 的马。"},{"u":"e2e4","san":"e4","c":"White pushes the e-pawn and builds the huge center — exactly what Black expected and invited. Black now plans to attack this center with pieces.","cZh":"白方挺 e4，筑起庞大中心——这正是黑方所料并有意邀请的。接下来黑方要用子力围攻它。"},{"u":"d5c3","san":"Nxc3","c":"Black trades knights right away. The e4-pawn was attacking the knight, so it swaps itself off before being pushed around.","cZh":"黑马立即换掉 c3 的马。e4 兵正攻击着它，与其被驱赶，不如主动交换。"},{"u":"b2c3","san":"bxc3","c":"White recaptures with the b-pawn, and the battle lines are set: White's pawn wall on c3, d4 and e4 against the bishop about to land on g7.","cZh":"白方用 b 兵吃回，结构就此定型：白方 c3-d4-e4 三兵中心，将与即将上 g7 的黑象长期较量。","k":["c3","d4"]},{"u":"f8g7","san":"Bg7","c":"The bishop lands on the long diagonal and takes aim at the base of White's pawn chain — d4 and, behind it, c3. Black's whole game revolves around this bishop's pressure.","cZh":"黑象上 g7，沿长斜线直指白方兵链的根基——d4 以及后面的 c3。黑方的整盘计划都围绕这只象的火力展开。","a":["g7d4"]},{"u":"f1c4","san":"Bc4","c":"White develops the bishop to an active diagonal pointing at Black's kingside. This is the classical setup for White in the Exchange Variation.","cZh":"白象出到 c4，占据指向黑方王翼的活跃斜线。这是交换变例中白方的古典布局。"},{"u":"c7c5","san":"c5","c":"Black attacks the d4-pawn with a pawn of his own, without delay. Hitting White's center before it settles is the heart of Black's plan.","cZh":"黑方刻不容缓挺 c5，用兵敲打 d4。趁白方中心立足未稳就发起冲击，正是黑方计划的核心。"},{"u":"g1e2","san":"Ne2","c":"White develops the knight to e2 instead of f3. From there it defends d4 while leaving the f-pawn free to advance later.","cZh":"白马走 e2 而不是 f3：既保护 d4，又不挡住 f 兵日后的挺进。"},{"u":"b8c6","san":"Nc6","c":"Black develops the knight and adds a second attacker against the d4-pawn. The squeeze on White's center keeps growing.","cZh":"黑马出 c6，给 d4 再添一名攻击者，对白方中心的压力继续增大。","a":["c6d4"]},{"u":"c1e3","san":"Be3","c":"White develops the bishop and gives d4 yet another defender. Both sides keep piling pieces around the same key square.","cZh":"白象出 e3，又给 d4 加了一名守卫。双方子力都在围绕这个焦点集结。"},{"u":"e8g8","san":"O-O","c":"Black castles, tucking the king safely in the corner. The pressure play then continues with moves like ...Bg4, ...Qa5 and ...cxd4, all aimed at White's center.","cZh":"黑方易位，王安全入角。随后可用 ...Bg4、...Qa5、...cxd4 等手段，继续围攻白方中心。"}]},{"name":"Russian System (5.Qb3)","nameZh":"俄罗斯体系（5.Qb3）","intro":"White defends c4 with the queen and grabs the centre. You counterattack it from the wings.","introZh":"白方用皇后护 c4 并占中心。你从两翼反击。","plan":"...a6 and ...b5 harass the queen; ...c5 and ...Bb7/...Nc6 hit d4 and e4. White's queen wanderings are your tempo bank.","planZh":"...a6、...b5 骚扰皇后；...c5、...Bb7/...Nc6 打击 d4、e4。白后奔波就是你的步调银行。","moves":[{"u":"d2d4","san":"d4","c":"White stakes a claim in the center with the d-pawn. It controls key central squares and frees the queen and bishop to come out.","cZh":"白方挺 d4 兵占据中心，控制要格，并让后和象可以出动。"},{"u":"g8f6","san":"Nf6","c":"Black develops (brings a piece into play) the knight to f6, where it fights for the central squares e4 and d5.","cZh":"黑方出马 f6，争夺中心的 e4 和 d5 格。"},{"u":"c2c4","san":"c4","c":"White pushes a second pawn to fight for the center and gain space, leaning on the d5-square.","cZh":"白方再挺 c4，争夺中心、扩大空间，向 d5 格施压。"},{"u":"g7g6","san":"g6","c":"Black prepares the fianchetto (bishop on the long diagonal): the bishop is headed for g7. The Grünfeld setup is taking shape.","cZh":"黑方准备侧翼出象，象将上 g7 长斜线。格林菲尔德阵型正在成形。"},{"u":"b1c3","san":"Nc3","c":"White develops the knight to its standard square, adding control over the center.","cZh":"白方例行出马 c3，加强对中心的控制。"},{"u":"d7d5","san":"d5","c":"The Grünfeld counterstrike: Black hits the center with a pawn right away instead of sitting back.","cZh":"格林菲尔德式反击：黑方不甘防守，立刻挺 d5 向中心开战。"},{"u":"g1f3","san":"Nf3","c":"Instead of taking on d5, White simply develops another piece first and keeps the central tension for now.","cZh":"白方不急于吃 d5，先出马 f3，暂时保留中心的紧张局势。"},{"u":"f8g7","san":"Bg7","c":"Black completes the fianchetto: the bishop settles on g7 and eyes the center along the long diagonal.","cZh":"黑方完成侧翼出象：g7 象沿长斜线遥控中心。"},{"u":"d1b3","san":"Qb3","c":"This early queen move marks the Russian System. From b3 the queen defends the c4-pawn and lines up behind it, backing up its attack on d5 — heavy pressure on Black's center pawn.","cZh":"白后早早出到 b3，这就是俄罗斯体系：既保住 c4 兵，又在其身后加大对黑方 d5 兵的压力。","a":["b3d5"]},{"u":"d5c4","san":"dxc4","c":"Black grabs the pawn on c4. The point isn't to keep it — it's to pull White's queen forward, where Black can chase it and gain time.","cZh":"黑兵吃 c4。目的不是守住这个兵，而是把白后引出来，之后不断驱赶它、赚取时间。"},{"u":"b3c4","san":"Qxc4","c":"The queen takes the pawn back, but now it stands out in the open. Black will develop pieces while poking at it.","cZh":"白后吃回兵，但位置暴露。黑方将一边出子，一边骚扰这只后。"},{"u":"e8g8","san":"O-O","c":"Black castles first — king safety before action. With the king tucked away, the campaign against White's exposed queen can begin.","cZh":"黑方先易位，把王安顿好，再对暴露在外的白后展开骚扰行动。"},{"u":"e2e4","san":"e4","c":"White plants a second pawn in the center — the dream setup. Black's whole plan now is to take that center apart piece by piece.","cZh":"白方挺 e4，占据梦想中的大中心。黑方接下来的全部计划，就是一步步拆掉它。"},{"u":"a7a6","san":"a6","c":"A small pawn move with a big idea — the Hungarian line. Black prepares ...b5, which will come with tempo (White's queen must stop and move again).","cZh":"小兵 a6 藏着大计划——匈牙利变例。黑方准备挺 ...b5，届时白后受攻只能再次搬家，黑方白赚一步。","a":["b7b5"]},{"u":"f1e2","san":"Be2","c":"White develops the bishop to a modest square. On e2 it stays clear of the tricks Black's coming ...b5 and ...b4 pawn pushes could create.","cZh":"白象低调出到 e2，避开黑方接下来 ...b5、...b4 挺兵可能带来的战术手段。"},{"u":"b7b5","san":"b5","c":"Right on schedule: the pawn attacks the queen, and White must stop everything to move it yet again. That lost time is Black's profit.","cZh":"如约而至：...b5 攻击白后，白方只得停下手头计划再次挪后。这些时间就是黑方的净赚。"},{"u":"c4b3","san":"Qb3","c":"The queen retreats to b3. It has now moved three times in the opening — time Black has spent on development instead.","cZh":"白后退回 b3。开局里它已走了三步，而黑方把同样的时间都花在了出子上。"},{"u":"c7c5","san":"c5","c":"The full counterattack begins: this pawn strikes at d4, and the g7-bishop's long diagonal suddenly blazes with targets. White's proud center is under real pressure.","cZh":"全面反击打响：c5 兵直击 d4，g7 象的长斜线火力全开，白方引以为傲的中心开始摇晃。","a":["c5d4","g7d4"]}]}]},{"name":"Scandinavian Defense","nameZh":"斯堪的纳维亚防御","side":"b","icon":"♛","desc":"Meet 1.e4 with 1...d5 — trade off White's centre pawn on move one and follow a clear, forcing setup.","descZh":"用 1...d5 应对 1.e4——第一回合就换掉白方中心兵，随后按清晰套路布阵。","lines":[{"name":"Main Line (3...Qa5)","nameZh":"主变（3...Qa5）","intro":"The classical Scandinavian: an ultra-solid structure with c6+e6, and every piece has one right square.","introZh":"古典斯堪的纳维亚：c6+e6 超稳结构，每个子都有唯一正确的位置。","plan":"Bf5, e6, c6, Bb4, Nbd7 — the setup is nearly automatic. Aim for ...O-O-O or ...O-O depending on White's play.","planZh":"Bf5、e6、c6、Bb4、Nbd7——布局近乎自动。视白方动向选择长易位或短易位。","moves":[{"u":"e2e4","san":"e4","c":"White pushes the king's pawn two squares — the most classical first move. It grabs space in the centre and opens lines for the queen and bishop.","cZh":"白方王前兵挺进两格，最经典的开局：抢占中心，同时为皇后和白格象打开出路。"},{"u":"d7d5","san":"d5","c":"Black strikes back at once, offering to trade off White's centre pawn on move one. That is the whole idea of the Scandinavian — challenge e4 immediately.","cZh":"黑方立即反击，第一步就挑战白方的 e4 中心兵——这正是斯堪的纳维亚防御的核心思路。"},{"u":"e4d5","san":"exd5","c":"White takes the d5 pawn. This is practically forced — there is no comfortable way to keep the e4 pawn defended.","cZh":"白方吃掉 d5 兵，几乎是必走的一手——e4 兵没有舒服的保护办法。"},{"u":"d8d5","san":"Qxd5","c":"Black takes back with the queen — yes, really. Bringing the queen out this early is usually risky, but the Scandinavian has a clear plan for keeping her safe.","cZh":"黑方用皇后吃回——没错，就是皇后。这么早出后通常有风险，但斯堪的纳维亚防御自有安顿她的成熟方案。"},{"u":"b1c3","san":"Nc3","c":"White develops the knight (brings it off the back rank) with tempo — it attacks your queen, so you must stop and move her while White gains time.","cZh":"白方跳马出子并抢步：马正攻击你的皇后，你必须花一步把她移开，白方等于白赚了出子时间。"},{"u":"d5a5","san":"Qa5","c":"The queen slides to a5, the classical square. There she stays active and is hard for White to attack again, so you lose no more time.","cZh":"皇后来到 a5——古典位置。她在这里保持主动，白方也很难再攻击她，你不会继续丢步。"},{"u":"d2d4","san":"d4","c":"White plants a second pawn in the centre, claiming space. Your job now is to develop quickly and build your solid setup around it.","cZh":"白方再挺 d4 兵占据中心、扩大空间。你的任务是加快出子，围绕它搭起坚固的阵型。"},{"u":"g8f6","san":"Nf6","c":"Develop the knight to f6, its best square. It controls the central squares e4 and d5 and brings you a step closer to castling.","cZh":"出马到最佳位置 f6：控制 e4、d5 等中心格，也为王车易位做好准备。"},{"u":"g1f3","san":"Nf3","c":"White develops the kingside knight to its most natural square — it guards the d4 pawn and prepares castling.","cZh":"白方出王翼马到 f3，自然的一手：保护 d4 兵，并准备易位。"},{"u":"c7c6","san":"c6","c":"The key move of the whole setup: the pawn gives your queen an escape route so she can never be trapped, and it builds a rock-solid pawn structure.","cZh":"整个体系的关键一手：给皇后留好退路，防止她被困，同时把兵形筑得坚如磐石。","k":["b5","d5"]},{"u":"f1c4","san":"Bc4","c":"White develops the bishop to c4, pointing straight at f7 — the weakest square next to your king. Stay alert for tricks against that square.","cZh":"白方出象到 c4，直指 f7——你王旁最薄弱的格子。要提防针对它的战术。"},{"u":"c8f5","san":"Bf5","c":"Bring this bishop out now, before you play ...e6 — that pawn move would lock it behind your own pawns. Order matters: bishop first, then e6.","cZh":"趁 ...e6 之前先出白格象，否则 e6 兵会把它关在兵链后面——出子顺序很重要。"},{"u":"c1d2","san":"Bd2","c":"White tucks the bishop on d2. This breaks the pin along the a5-e1 diagonal (your queen was lined up toward White's king) and quietly prepares tricks with a knight jump to d5. Watch out for that idea.","cZh":"白方象回 d2：化解 a5-e1 斜线上的牵制（你的皇后正对着白王方向），并暗藏 Nd5 的战术手段，要多加提防。"},{"u":"e7e6","san":"e6","c":"Now play ...e6 and finish the pawn wall. With pawns on c6 and e6 your position is extremely solid, and the f8 bishop can come out next.","cZh":"现在走 ...e6，筑完兵墙。c6 加 e6 的结构非常坚固，黑格象接下来也可以出动了。"},{"u":"d1e2","san":"Qe2","c":"White's queen steps to e2, vacating d1 and preparing to castle long (king to the queenside). Expect White's king to head that way.","cZh":"白方皇后走到 e2，腾出 d1 格，准备长易位，把王转移到后翼。"},{"u":"f8b4","san":"Bb4","c":"Develop the bishop to b4, pressing on the c3 knight. Every piece now sits on its right square — your setup is complete, solid and safe.","cZh":"出象到 b4，施压 c3 马。至此每个子都在正确的位置上，你的布局完整、稳固又安全。","a":["b4c3"]}]},{"name":"Modern (3...Qd6)","nameZh":"现代变例（3...Qd6）","intro":"The modern favourite: the queen sits on d6, flexible and annoying, often supporting ...O-O-O.","introZh":"现代宠儿：皇后驻 d6，灵活又烦人，常支援长易位。","plan":"Develop ...Bg4/...Nc6 fast, castle long, and use the half-open d-file. Opposite castling means honest attacking chess.","planZh":"快出 ...Bg4/...Nc6，长易位，利用半开放 d 线。异侧易位意味着真刀真枪的对攻。","moves":[{"u":"e2e4","san":"e4","c":"White opens with the king's pawn, grabbing central space and freeing the queen and bishop.","cZh":"白方王前兵开局，抢占中心并为皇后和象打开出路。"},{"u":"d7d5","san":"d5","c":"Strike at the centre immediately — the Scandinavian signature. You offer a pawn trade to remove White's e4 pawn on move one.","cZh":"第一步就反击中心——斯堪的纳维亚的招牌：用 d5 兵换掉白方的 e4 兵。"},{"u":"e4d5","san":"exd5","c":"White captures the pawn, as expected — the main way to meet your challenge.","cZh":"白方吃兵，意料之中的应对。"},{"u":"d8d5","san":"Qxd5","c":"Take back with the queen. She comes out early, but you have a plan to keep her both safe and useful.","cZh":"皇后吃回。虽然出后很早，但接下来你有安顿她的成熟方案。"},{"u":"b1c3","san":"Nc3","c":"White develops the knight with tempo — it attacks your queen, so you must stop and react, and White gains time.","cZh":"白方跳马抢步出子：攻击你的皇后，逼你先回应，白方赚到时间。"},{"u":"d5d6","san":"Qd6","c":"The queen drops back to d6, the modern favourite. From here she watches e5 and b4 and supports play down the d-file — flexible and surprisingly annoying for White.","cZh":"皇后退到 d6——现代主流位置：兼顾 e5、b4，并支援 d 线，灵活且让白方头疼。"},{"u":"d2d4","san":"d4","c":"White plants a second pawn in the centre, taking space. Keep developing — later your pieces can press against this d4 pawn.","cZh":"白方再挺 d4 兵占中心、夺空间。继续出子，之后你的子力可以围攻这只兵。"},{"u":"g8f6","san":"Nf6","c":"Develop the knight to f6, its best square — it fights for the centre and prepares castling.","cZh":"出马到 f6 这个最佳位置：争夺中心，并为易位做准备。"},{"u":"g1f3","san":"Nf3","c":"White develops the kingside knight — natural and flexible, guarding d4 and preparing to castle.","cZh":"白方出王翼马，自然的一手：保护 d4，准备易位。"},{"u":"a7a6","san":"a6","c":"A quiet but important little move: it takes away the b5 square, so White's knight can never jump there to harass your queen on d6.","cZh":"低调却重要的一小步：控制住 b5 格，让白马无法跳过去骚扰 d6 的皇后。"},{"u":"g2g3","san":"g3","c":"White prepares a fianchetto (bishop on the long diagonal, here via g2) — a setup aimed against your queenside plans.","cZh":"白方准备侧翼出象（象将上 g2 长斜线），针对你在后翼的计划。"},{"u":"c8g4","san":"Bg4","c":"Develop the bishop to g4 with a pin: the f3 knight is tied down, because moving it would expose White's queen on d1.","cZh":"出象到 g4 形成牵制：f3 马被钉住，一动就会暴露 d1 的白后。","a":["g4f3"]},{"u":"f1g2","san":"Bg2","c":"White finishes the fianchetto — the bishop lands on g2 and the kingside setup is complete.","cZh":"白方象上 g2，完成侧翼布局。"},{"u":"b8c6","san":"Nc6","c":"Develop the knight to c6: it adds pressure on the d4 pawn and clears the back rank so you can castle long (queenside).","cZh":"跳马到 c6：施压 d4 兵，同时腾空底线，为长易位做准备。","a":["c6d4"]},{"u":"e1g1","san":"O-O","c":"White castles short (kingside), tucking the king behind the g2 bishop...","cZh":"白方短易位，王躲到王翼 g2 象的后面……"},{"u":"e8c8","san":"O-O-O","c":"...and you castle long, to the queenside. Kings on opposite sides means a race of attacks — and you start ahead, because your rook, knight and queen already stare at the d4 pawn.","cZh":"……你长易位到后翼。双方异侧易位，对攻竞赛开始——你的车、马、皇后已齐齐盯住 d4 兵，先声夺人。","k":["d4"]}]}]},{"name":"Pirc Defense","nameZh":"皮尔茨防御","side":"b","icon":"♟","desc":"Let White build the centre, develop behind the lines with g6+Bg7, then counterpunch. Rich, flexible, ambush chess.","descZh":"放白方筑中心，用 g6+Bg7 在暗处布阵，伺机反击。丰富、灵活的伏击棋。","lines":[{"name":"Classical (5.Be2)","nameZh":"古典体系（5.Be2）","intro":"White plays sensibly. You equalize with ...e5 and outplay him in the middlegame.","introZh":"白方规规矩矩。你以 ...e5 均势，再在中局智取。","plan":"After ...e5 you have a King's-Indian-like game with extra flexibility: ...exd4, ...Re8, ...Bg4 are all on the menu.","planZh":"...e5 之后类似王印却更灵活：...exd4、...Re8、...Bg4 皆可入选。","moves":[{"u":"e2e4","san":"e4","c":"White opens with the king's pawn, grabbing space in the center and freeing the bishop and queen to come out.","cZh":"白方王兵开局，抢占中心空间，同时为象和后打开出路。"},{"u":"d7d6","san":"d6","c":"The Pirc Defense. This quiet pawn move looks modest, but it has real bite: Black lets White build a big center first, planning to strike back at it later.","cZh":"皮尔茨防御。这步兵看似低调，实则暗藏杀机：先让白方搭起大中心，日后再出手反击。"},{"u":"d2d4","san":"d4","c":"White plants a second pawn in the center, taking the full center with pawns on e4 and d4. That is exactly what the Pirc invites — this big center will become Black's target.","cZh":"白方再进一兵，e4、d4 双兵占满中心。这正中皮尔茨下怀——这个大中心将成为黑方的攻击目标。"},{"u":"g8f6","san":"Nf6","c":"Develop the knight (bring it off the back rank) and attack the e4 pawn right away. White must spend a move defending it.","cZh":"出马（把子力调离底线），立刻攻击 e4 兵，白方必须花一步来保护它。","a":["f6e4"]},{"u":"b1c3","san":"Nc3","c":"White develops the queenside knight to defend the e4 pawn.","cZh":"白方出后翼马，保护 e4 兵。"},{"u":"g7g6","san":"g6","c":"Prepare a fianchetto (putting the bishop on the long diagonal at g7). That bishop will be both your king's bodyguard and your main attacking weapon.","cZh":"准备侧翼出象（象上 g7 长斜线）。这只象既是王的贴身护卫，也是你的主力进攻武器。"},{"u":"g1f3","san":"Nf3","c":"White develops the other knight — the calm Classical setup. No early attack, just sensible healthy moves.","cZh":"白方出另一只马——古典变例。不急于进攻，只是稳稳当当地布阵。"},{"u":"f8g7","san":"Bg7","c":"The bishop lands on g7 — the famous Pirc bishop. From here it aims down the long diagonal, straight at White's center.","cZh":"象落 g7——皮尔茨的招牌象。它沿长斜线遥指白方中心。","a":["g7d4"]},{"u":"f1e2","san":"Be2","c":"White develops the bishop to a safe, sensible square and gets ready to castle.","cZh":"白方象出 e2，稳健出子，准备易位。"},{"u":"e8g8","san":"O-O","c":"Castle (tuck the king into the corner behind the g7 bishop and its pawn wall). Safety first — with the king secure you can fight in the center with confidence.","cZh":"易位（王藏进角落，躲在 g7 象和兵墙后面）。安全第一，王稳了才好放手争夺中心。"},{"u":"e1g1","san":"O-O","c":"White castles too. With both kings safely tucked away, the real middlegame battle begins.","cZh":"白方也易位。双方王都安顿好了，真正的中盘较量开始。"},{"u":"c7c6","san":"c6","c":"A flexible little pawn move: it supports a later ...d5 or ...b5 push, and it clears the c7 square for your queen.","cZh":"灵活的一步小兵：既支援日后的 ...d5 或 ...b5，又为皇后腾出 c7 格。"},{"u":"a2a4","san":"a4","c":"White pushes the a-pawn to stop your ...b5 expansion on the queenside.","cZh":"白方推 a4，阻止你走 ...b5 在后翼扩张。"},{"u":"b8d7","san":"Nbd7","c":"Develop the queenside knight to d7. It supports the key pawn break ...e5 — the move that will free your whole position.","cZh":"后翼马出 d7，支援关键的 ...e5 突破——那一步将解放你的全局。"},{"u":"f1e1","san":"Re1","c":"White puts the rook on the e-file, preparing the e4-e5 push and ready to take control of the file the moment the center opens.","cZh":"白车上 e1，为 e4-e5 的推进做准备；中心一旦打开，就能立刻控制 e 线。"},{"u":"e7e5","san":"e5","c":"The freeing break at last. You strike at White's center with your own central pawn, reach a fully equal game — and the position still has plenty of play left for you to outplay your opponent.","cZh":"解放性的突破终于打出。用中心兵冲击白方中心，局面完全均势，而且后续仍大有可为。","k":["e5","d4"]}]},{"name":"Austrian Attack (4.f4)","nameZh":"奥地利进攻（4.f4）","intro":"White goes for the throat with f4-e5. Cool defence turns his space into overextension.","introZh":"白方用 f4-e5 直取咽喉。冷静防守能让其空间变成冒进。","plan":"Don't panic: ...c5 hits d4 before the e5-push works. The g7-bishop and ...Bg4 make d4 a permanent patient.","planZh":"别慌：...c5 在 e5 奏效前先敲 d4。g7 象加 ...Bg4 让 d4 长期卧床。","moves":[{"u":"e2e4","san":"e4","c":"White opens with the king's pawn, grabbing space in the center.","cZh":"白方王兵开局，抢占中心空间。"},{"u":"d7d6","san":"d6","c":"The Pirc Defense: a quiet pawn move that invites White to build a big center, planning to counterattack it later.","cZh":"皮尔茨防御：低调的一步兵，先请白方搭起大中心，日后再对它发起反击。"},{"u":"d2d4","san":"d4","c":"White takes the full center with a second pawn on d4, right next to e4.","cZh":"白方再进一兵到 d4，与 e4 并肩，占据全中心。"},{"u":"g8f6","san":"Nf6","c":"Develop the knight and attack the e4 pawn right away, forcing White to defend it.","cZh":"出马立刻攻击 e4 兵，逼白方分身保护。"},{"u":"b1c3","san":"Nc3","c":"White develops the knight to defend the e4 pawn.","cZh":"白方出马保护 e4 兵。"},{"u":"g7g6","san":"g6","c":"Prepare the fianchetto (bishop on the long diagonal at g7) — the standard Pirc setup for both defense and counterattack.","cZh":"准备侧翼出象（象上 g7 长斜线）——皮尔茨的标准布置，攻防兼备。"},{"u":"f2f4","san":"f4","c":"The Austrian Attack. White throws the f-pawn forward, planning to push e5 next and roll a pawn avalanche at your king.","cZh":"奥地利进攻。白方猛推 f 兵，下一步想推 e5，在王翼掀起兵的雪崩。","a":["f4e5"]},{"u":"f8g7","san":"Bg7","c":"Stay calm and keep developing. From g7 your bishop keeps a close watch on White's d4 pawn.","cZh":"沉着继续出子。g7 象紧紧盯住白方的 d4 兵。"},{"u":"g1f3","san":"Nf3","c":"White develops the knight to support his big pawn center.","cZh":"白方出马，支援庞大的兵中心。"},{"u":"e8g8","san":"O-O","c":"Castle right into the storm — it looks scary, but it is correct: when the center opens up, it is your pieces that will benefit.","cZh":"迎着攻势易位——看似危险，其实正确：中心一旦打开，得利的是你的子力。"},{"u":"f1d3","san":"Bd3","c":"White develops the bishop to d3, pointing it at your king and completing his attacking setup.","cZh":"白象出 d3 指向你的王，完成进攻布置。"},{"u":"b8a6","san":"Na6","c":"The modern move. From the edge this knight will reroute to c7 or b4, and the counterpunch ...c5 comes next.","cZh":"现代下法：这只边马将绕道奔 c7 或 b4，随后就打出 ...c5 反击。"},{"u":"e1g1","san":"O-O","c":"White castles, getting the king to safety before pushing the attack further.","cZh":"白方易位，先把王安置好，再继续推进攻势。"},{"u":"c7c5","san":"c5","c":"The counterstrike. Your pawn hits d4 and forces it to declare itself: push on, capture, or stay and be defended.","cZh":"反击打响。这步兵直击 d4，逼它表态：是前进、吃兵，还是原地死守。","a":["c5d4"]},{"u":"d4d5","san":"d5","c":"White pushes past your pawn and locks the center closed with a pawn chain.","cZh":"白方推 d5 越过你的兵，把中心封锁起来。"},{"u":"c8g4","san":"Bg4","c":"Pin the f3 knight to the queen behind it (if it moves, your bishop takes the queen). That knight was the key supporter of White's e5 advance, so the attack stalls — and your a6 knight is heading for b5 via ...Nc7.","cZh":"出象 g4 牵制 f3 马（它一动，象就吃后）。这只马本是白方 e5 推进的关键支援，攻势因此受阻；你的 a6 马也正经 ...Nc7 奔向 b5。","a":["g4f3"]}]}]}]};
